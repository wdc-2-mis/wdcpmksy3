<!-- =========================================================
     WDC-PMKSY GLOBAL WATER LOADING OVERLAY
     ========================================================= -->
<div id="waterLoadingOverlay" class="water-loading-overlay">

    <div class="water-loading-content">

        <div class="water-drop-wrapper">

            <svg class="water-drop-svg" viewBox="0 0 220 280"
                 xmlns="http://www.w3.org/2000/svg">

                <defs>

                    <!-- Water gradient -->
                    <linearGradient id="waterGradient"
                                    x1="0%"
                                    y1="0%"
                                    x2="100%"
                                    y2="100%">

                        <stop offset="0%" stop-color="#e8f8ff"/>
                        <stop offset="25%" stop-color="#42b9ff"/>
                        <stop offset="55%" stop-color="#087fd1"/>
                        <stop offset="80%" stop-color="#0755a0"/>
                        <stop offset="100%" stop-color="#022f66"/>

                    </linearGradient>

                    <!-- Inner water gradient -->
                    <linearGradient id="innerWaterGradient"
                                    x1="0%"
                                    y1="100%"
                                    x2="100%"
                                    y2="0%">

                        <stop offset="0%" stop-color="#0b63b6"/>
                        <stop offset="45%" stop-color="#27b9ff"/>
                        <stop offset="70%" stop-color="#67e8f9"/>
                        <stop offset="100%" stop-color="#0b5ba8"/>

                    </linearGradient>

                    <!-- Glow -->
                    <filter id="waterGlow"
                            x="-50%"
                            y="-50%"
                            width="200%"
                            height="200%">

                        <feGaussianBlur stdDeviation="5"
                                        result="blur"/>

                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>

                    </filter>

                    <!-- Drop shape -->
                    <clipPath id="dropClip">

                        <path d="
                            M110 8
                            C110 8 38 95 38 160
                            C38 218 70 255 110 255
                            C150 255 182 218 182 160
                            C182 95 110 8 110 8 Z
                        "/>

                    </clipPath>

                </defs>


                <!-- =================================================
                     OUTER GLOW
                     ================================================= -->
                <path d="
                    M110 8
                    C110 8 38 95 38 160
                    C38 218 70 255 110 255
                    C150 255 182 218 182 160
                    C182 95 110 8 110 8 Z
                "
                fill="url(#waterGradient)"
                opacity="0.25"
                filter="url(#waterGlow)"/>


                <!-- =================================================
                     MAIN WATER DROP
                     ================================================= -->
                <path d="
                    M110 8
                    C110 8 38 95 38 160
                    C38 218 70 255 110 255
                    C150 255 182 218 182 160
                    C182 95 110 8 110 8 Z
                "
                fill="url(#waterGradient)"
                stroke="#bdeeff"
                stroke-width="2"/>


                <!-- =================================================
                     ANIMATED 3D WATER PATTERN
                     ================================================= -->
                <g clip-path="url(#dropClip)"
                   class="water-pattern">

                    <!-- Large rotating ring -->
                    <ellipse cx="110"
                             cy="160"
                             rx="72"
                             ry="30"
                             fill="none"
                             stroke="#6ee7ff"
                             stroke-width="8"
                             opacity="0.8">

                        <animateTransform
                            attributeName="transform"
                            type="rotate"
                            from="0 110 160"
                            to="360 110 160"
                            dur="3.5s"
                            repeatCount="indefinite"/>

                    </ellipse>


                    <!-- Second rotating ring -->
                    <ellipse cx="110"
                             cy="160"
                             rx="60"
                             ry="22"
                             fill="none"
                             stroke="#20d5c8"
                             stroke-width="7"
                             opacity="0.75">

                        <animateTransform
                            attributeName="transform"
                            type="rotate"
                            from="360 110 160"
                            to="0 110 160"
                            dur="2.8s"
                            repeatCount="indefinite"/>

                    </ellipse>


                    <!-- Third ring -->
                    <ellipse cx="110"
                             cy="160"
                             rx="48"
                             ry="16"
                             fill="none"
                             stroke="#b4f4ff"
                             stroke-width="5"
                             opacity="0.85">

                        <animateTransform
                            attributeName="transform"
                            type="rotate"
                            from="0 110 160"
                            to="360 110 160"
                            dur="2s"
                            repeatCount="indefinite"/>

                    </ellipse>


                    <!-- Moving wave -->
                    <path d="
                        M20 165
                        C55 125 85 205 120 165
                        C150 130 175 190 205 150
                    "
                    fill="none"
                    stroke="#ffffff"
                    stroke-width="5"
                    opacity="0.65">

                        <animate
                            attributeName="d"
                            dur="2s"
                            repeatCount="indefinite"
                            values="
                            M20 165 C55 125 85 205 120 165 C150 130 175 190 205 150;
                            M20 150 C55 190 85 120 120 160 C150 195 175 125 205 165;
                            M20 165 C55 125 85 205 120 165 C150 130 175 190 205 150
                            "/>

                    </path>


                    <!-- Highlight -->
                    <ellipse cx="88"
                             cy="90"
                             rx="18"
                             ry="45"
                             fill="#ffffff"
                             opacity="0.20"
                             transform="rotate(20 88 90)"/>

                </g>


                <!-- =================================================
                     GLASS HIGHLIGHT
                     ================================================= -->
                <path d="
                    M75 80
                    C88 53 102 32 110 20
                    C93 55 80 80 75 110
                "
                fill="none"
                stroke="#ffffff"
                stroke-width="6"
                stroke-linecap="round"
                opacity="0.65"/>

            </svg>

        </div>


        <!-- Loading text -->
        <div class="water-loading-title">
            Please wait...
        </div>

        <div id="waterLoadingMessage"
             class="water-loading-message">
            Your request is being processed.
        </div>

    </div>

</div>
</body>
