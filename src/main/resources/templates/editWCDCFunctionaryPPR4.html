<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>Update District Functionaries PPR4B</title>

<style>
    .required { 
		color: red; 
	}
    body { 
		background: #f8f9fa; 
	}
    .card { 
		border-radius: 0; 
	}
    .table th, .table td { 
		vertical-align: middle; 
		text-align: center; 
	}
    .form-control, .form-select { 
		border-radius: 0; 
	}
    .heading { 
		font-size: 22px; 
		font-weight: bold; 
		text-align: center; 
		margin-bottom: 25px; 
	}
    label { 
		font-weight: 600; 
	}
    .field-error { 
		color: red; 
		font-size: 13px; 
		margin-top: 4px; 
		display: none; 
	}
    .row-field-error { 
		color: red; 
		font-size: 12px; 
		margin-top: 3px; 
	}
    .year-error, .day-error { 
		color: red; 
		font-size: 12px; 
		margin-top: 3px; 
		display: none; 
	}
    .is-invalid-custom { 
		border: 1px solid red !important; 
	}
    textarea.is-invalid-custom, select.is-invalid-custom, input.is-invalid-custom { 
		border-color: red !important; 
	}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("wcdcFunctionaries");
    if (!form) return;

    function showError(field, message) {
        if (!field) return;
        field.classList.add("is-invalid-custom");
        let errorDiv = document.getElementById(field.id + "Error");
        if (!errorDiv) {
            errorDiv = document.createElement("div");
            errorDiv.id = field.id + "Error";
            errorDiv.className = "field-error";
            field.parentNode.appendChild(errorDiv);
        }
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
    }

    function clearError(field) {
        if (!field) return;
        field.classList.remove("is-invalid-custom");
        const errorDiv = document.getElementById(field.id + "Error");
        if (errorDiv) {
            errorDiv.textContent = "";
            errorDiv.style.display = "none";
        }
    }

    function showRowError(field, message) {
        if (!field) return;
        field.classList.add("is-invalid-custom");
        let errorDiv = field.parentNode.querySelector(".row-field-error");
        if (!errorDiv) {
            errorDiv = document.createElement("div");
            errorDiv.className = "row-field-error";
            field.parentNode.appendChild(errorDiv);
        }
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
    }

    function clearRowError(field) {
        if (!field) return;
        field.classList.remove("is-invalid-custom");
        const errorDiv = field.parentNode.querySelector(".row-field-error");
        if (errorDiv) {
            errorDiv.textContent = "";
            errorDiv.style.display = "none";
        }
    }

    function showYearError(field, message) {
        if (!field) return;
        field.classList.add("is-invalid-custom");
        const errorDiv = field.parentNode.querySelector(".year-error");
        if (errorDiv) {
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
        }
    }

    function clearYearError(field) {
        if (!field) return;
        field.classList.remove("is-invalid-custom");
        const errorDiv = field.parentNode.querySelector(".year-error");
        if (errorDiv) {
            errorDiv.textContent = "";
            errorDiv.style.display = "none";
        }
    }

    function showDayError(field, message) {
        if (!field) return;
        field.classList.add("is-invalid-custom");
        const errorDiv = field.parentNode.querySelector(".day-error");
        if (errorDiv) {
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
        }
    }

    function clearDayError(field) {
        if (!field) return;
        field.classList.remove("is-invalid-custom");
        const errorDiv = field.parentNode.querySelector(".day-error");
        if (errorDiv) {
            errorDiv.textContent = "";
            errorDiv.style.display = "none";
        }
    }

    function clearAllErrors() {
        form.querySelectorAll(".field-error, .year-error, .day-error").forEach(function (div) {
            div.textContent = "";
            div.style.display = "none";
        });
        form.querySelectorAll(".row-field-error").forEach(function (div) {
            div.remove();
        });
        form.querySelectorAll(".is-invalid-custom").forEach(function (field) {
            field.classList.remove("is-invalid-custom");
        });
    }

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        clearAllErrors();

        let isValid = true;
        let firstInvalidField = null;

        function markInvalid(field, message) {
            showError(field, message);
            if (!firstInvalidField) firstInvalidField = field;
            isValid = false;
        }

        const district = document.getElementById("district");
        if (!district || district.value.trim() === "") markInvalid(district, "Please select District.");

        const fname = document.getElementById("fname");
        if (!fname || fname.value.trim() === "") markInvalid(fname, "Please enter First Name.");

        const designation = document.getElementById("designation");
        if (!designation || designation.value.trim() === "") markInvalid(designation, "Please select Designation.");

        const qualification = document.getElementById("qualification");
        if (!qualification || qualification.value.trim() === "") markInvalid(qualification, "Please select Qualification.");

        const workallocation = document.getElementById("workallocation");
        if (!workallocation || workallocation.value.trim() === "") markInvalid(workallocation, "Please enter Work Allocation.");

        function validateAmount(field, message) {
            if (!field) return true;
            const value = field.value.trim();
            if (value === "") {
                markInvalid(field, message);
                return false;
            }
            if (!/^\d+(\.\d{1,2})?$/.test(value)) {
                markInvalid(field, message + " must be a valid number with maximum 2 decimal places.");
                return false;
            }
            return true;
        }

        validateAmount(document.getElementById("slr"), "Please enter Recurring Budget of Watershed Cell");
        validateAmount(document.getElementById("slnr"), "Please enter Non-Recurring Budget of Watershed Cell");
        validateAmount(document.getElementById("dlr"), "Please enter Recurring Funding Expected from DoLR");
        validateAmount(document.getElementById("dlnr"), "Please enter Non-Recurring Funding Expected from DoLR");

        const rows = document.querySelectorAll("#experienceTable tr");
        if (rows.length === 0) isValid = false;

        rows.forEach(function (row, index) {
            const office = row.querySelector("input[name='officename[]']");
            const address = row.querySelector("input[name='address[]']");
            const year = row.querySelector("input[name='yr[]']");
            const day = row.querySelector("input[name='day[]']");
            const work = row.querySelector("textarea[name='workdetail[]']");
            const rowNumber = index + 1;

            if (!office || office.value.trim() === "") {
                showRowError(office, "Please enter Office Name in Row " + rowNumber + ".");
                if (!firstInvalidField) firstInvalidField = office;
                isValid = false;
            } else clearRowError(office);

            if (!address || address.value.trim() === "") {
                showRowError(address, "Please enter Address in Row " + rowNumber + ".");
                if (!firstInvalidField) firstInvalidField = address;
                isValid = false;
            } else clearRowError(address);

            if (!year || year.value.trim() === "") {
                showYearError(year, "Please enter Experience Year in Row " + rowNumber + ".");
                if (!firstInvalidField) firstInvalidField = year;
                isValid = false;
            } else if (!/^\d+$/.test(year.value.trim())) {
                showYearError(year, "Experience Year must be numeric in Row " + rowNumber + ".");
                if (!firstInvalidField) firstInvalidField = year;
                isValid = false;
            } else if (parseInt(year.value.trim(), 10) > 30) {
                showYearError(year, "Experience Year cannot be greater than 30 in Row " + rowNumber + ".");
                if (!firstInvalidField) firstInvalidField = year;
                isValid = false;
            } else clearYearError(year);

            if (!day || day.value.trim() === "") {
                showDayError(day, "Please enter Experience Day in Row " + rowNumber + ".");
                if (!firstInvalidField) firstInvalidField = day;
                isValid = false;
            } else if (!/^\d+$/.test(day.value.trim())) {
                showDayError(day, "Experience Day must be numeric in Row " + rowNumber + ".");
                if (!firstInvalidField) firstInvalidField = day;
                isValid = false;
            } else if (parseInt(day.value.trim(), 10) > 364) {
                showDayError(day, "Experience Day cannot be greater than 364 in Row " + rowNumber + ".");
                if (!firstInvalidField) firstInvalidField = day;
                isValid = false;
            } else clearDayError(day);

            if (!work || work.value.trim() === "") {
                showRowError(work, "Please enter Work Details in Row " + rowNumber + ".");
                if (!firstInvalidField) firstInvalidField = work;
                isValid = false;
            } else clearRowError(work);
        });

        if (!isValid) {
            if (firstInvalidField) {
                firstInvalidField.scrollIntoView({ behavior: "smooth", block: "center" });
                firstInvalidField.focus();
            }
            return false;
        }

        form.submit();
    });

    ["slr", "slnr", "dlr", "dlnr"].forEach(function (id) {
        const field = document.getElementById(id);
        if (!field) return;
        field.addEventListener("input", function () {
            this.value = this.value.replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1");
            const match = this.value.match(/^\d+(\.\d{0,2})?/);
            this.value = match ? match[0] : "";
            clearError(this);
        });
    });

    ["district", "fname", "lname", "designation", "qualification", "workallocation"].forEach(function (id) {
        const field = document.getElementById(id);
        if (!field) return;
        field.addEventListener("input", function () { clearError(this); });
        field.addEventListener("change", function () { clearError(this); });
    });

    form.addEventListener("input", function (e) {
        if (e.target.matches("input[name='officename[]'], input[name='address[]'], textarea[name='workdetail[]']")) {
            clearRowError(e.target);
        }
        if (e.target.matches("input[name='yr[]']")) clearYearError(e.target);
        if (e.target.matches("input[name='day[]']")) clearDayError(e.target);
    });
});

/* ADD / REMOVE EXPERIENCE ROW
   + stays on the first row; cloned rows receive ×; new rows go at bottom. */
document.addEventListener("click", function (e) {
    const addButton = e.target.closest(".addRow");

    if (addButton) {
        const currentRow = addButton.closest("tr");
        const tbody = document.getElementById("experienceTable");
        if (!currentRow || !tbody) return;

        const newRow = currentRow.cloneNode(true);

        newRow.querySelectorAll("input, textarea").forEach(function (field) {
            field.value = "";
            field.classList.remove("is-invalid-custom");
        });

        newRow.querySelectorAll(".field-error, .year-error, .day-error").forEach(function (div) {
            div.textContent = "";
            div.style.display = "none";
        });

        newRow.querySelectorAll(".row-field-error").forEach(function (div) {
            div.remove();
        });

        const actionCell = newRow.querySelector("td:last-child");
        actionCell.innerHTML =
            '<button type="button" class="btn btn-danger btn-sm removeRow">×</button>';

        // Append to the end (not immediately after the clicked row)
        tbody.appendChild(newRow);
        return;
    }

    const removeButton = e.target.closest(".removeRow");
    if (removeButton) {
        const tbody = document.getElementById("experienceTable");
        if (!tbody) return;

        if (tbody.querySelectorAll("tr").length <= 1) return;
        removeButton.closest("tr").remove();
    }
});
</script>
</head>

<body>
<div layout:fragment="content">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Update the Details of Watershed Cell Functionaries at District Level (PPR4B)</h4>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card-body">
            <form id="wcdcFunctionaries" th:action="@{/UpdateWCDCFunctionariesPPR4B}" method="post">
                <input type="hidden" name="pprwcdcFunId" th:value="${functionary.pprWcdcFunId}">
                <input type="hidden" name="action" id="action" value="D">

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label"><b>District</b> <span class="required">*</span></label>
                        <select id="district" name="district" class="form-select">
                            <option value="">--Select District--</option>
                            <th:block th:each="dist : ${distList}">
                                <option th:value="${dist.dcode}" th:text="${dist.distName}"
                                        th:selected="${dist.dcode == functionary.wcdcDetails.dcode}"></option>
                            </th:block>
                        </select>
                        <div id="districtError" class="field-error"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label"><b>First Name</b> <span class="required">*</span></label>
                        <input type="text" name="fname" id="fname" th:value="${functionary.firstName}" class="form-control">
                        <div id="fnameError" class="field-error"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label"><b>Last Name</b></label>
                        <input type="text" name="lname" id="lname" th:value="${functionary.lastName}" class="form-control">
                        <div id="lnameError" class="field-error"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label"><b>Designation</b> <span class="required">*</span></label>
                        <select class="form-select" name="designation" id="designation">
                            <option value="">--Select Designation--</option>
                            <th:block th:each="des : ${designationList}">
                                <option th:value="${des.designationId}" th:text="${des.designationName}"
                                        th:selected="${des.designationId == functionary.designation.designationId}"></option>
                            </th:block>
                        </select>
                        <div id="designationError" class="field-error"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label"><b>Qualification</b> <span class="required">*</span></label>
                        <select class="form-select" name="qualification" id="qualification">
                            <option value="">--Select Qualification--</option>
                            <th:block th:each="qua : ${qualificationList}">
                                <option th:value="${qua.qualificationId}" th:text="${qua.qualificationName}"
                                        th:selected="${qua.qualificationId == functionary.qualification.qualificationId}"></option>
                            </th:block>
                        </select>
                        <div id="qualificationError" class="field-error"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label"><b>Work Allocation</b> <span class="required">*</span></label>
                        <textarea name="workallocation" id="workallocation" class="form-control" rows="2"
                                  th:text="${functionary.workAllocation}"></textarea>
                        <div id="workallocationError" class="field-error"></div>
                    </div>
                </div>

                <div class="row mb-3 mt-4">
                    <div class="col-md-3"><label>Monthly Remuneration (Rs.)</label></div>
                    <div class="col-md-3"><label class="mb-1">Recurring</label></div>
                    <div class="col-md-3"><label class="mb-1">Non-Recurring</label></div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-3">Total Budget of Watershed Cell <span class="required">*</span></div>
                    <div class="col-md-3">
                        <input type="text" name="slr" id="slr" maxlength="11"
                               th:value="${functionary.totalBudgetRecurring}" style="height:40px; width:120px;">
                        <div id="slrError" class="field-error"></div>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="slnr" id="slnr" maxlength="11"
                               th:value="${functionary.totalBudgetNonRecurring}" style="height:40px; width:120px;">
                        <div id="slnrError" class="field-error"></div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-3">Funding Expected from DoLR <span class="required">*</span></div>
                    <div class="col-md-3">
                        <input type="text" name="dlr" id="dlr" maxlength="11"
                               th:value="${functionary.dolrFundRecurring}" style="height:40px; width:120px;">
                        <div id="dlrError" class="field-error"></div>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="dlnr" id="dlnr" maxlength="11"
                               th:value="${functionary.dolrFundNonRecurring}" style="height:40px; width:120px;">
                        <div id="dlnrError" class="field-error"></div>
                    </div>
                </div>

                <hr>
                <h4 class="mb-3">Experience Details <span class="required">*</span></h4>

                <table class="table table-bordered">
                    <thead class="table-light">
                    <tr>
                        <th width="15%">Office Name</th>
                        <th width="25%">Address</th>
                        <th width="20%">Experience in No. of Years and Days</th>
                        <th width="30%">Work Details</th>
                        <th width="10%">Action</th>
                    </tr>
                    </thead>

                    <tbody id="experienceTable">
                    <tr th:each="exp, iterStat : ${experiences}">
                        <td><input type="text" name="officename[]" th:value="${exp.officeName}" class="form-control"></td>
                        <td><input type="text" name="address[]" th:value="${exp.address}" class="form-control"></td>
                        <td>
                            <div>
                                <input type="text" name="yr[]" th:value="${exp.workExpYrs}" class="form-control"
                                       maxlength="2" minlength="1" style="width:80px;" placeholder="Year"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                                <div class="year-error"></div>
                            </div>
                            <div class="mt-2">
                                <input type="text" name="day[]" th:value="${exp.workExpDays}" class="form-control"
                                       maxlength="3" minlength="1" style="width:80px;" placeholder="Day"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                                <div class="day-error"></div>
                            </div>
                        </td>
                        <td><textarea name="workdetail[]" class="form-control" rows="3" th:text="${exp.workDetails}"></textarea></td>
                        <td>
                            <button th:if="${iterStat.first}" type="button" class="btn btn-success btn-sm addRow">+</button>
                            <button th:unless="${iterStat.first}" type="button" class="btn btn-danger btn-sm removeRow">×</button>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(experiences)}">
                        <td><input type="text" name="officename[]" class="form-control"></td>
                        <td><input type="text" name="address[]" class="form-control"></td>
                        <td>
                            <div>
                                <input type="text" name="yr[]" class="form-control" maxlength="2" minlength="1"
                                       style="width:80px;" placeholder="Year"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                                <div class="year-error"></div>
                            </div>
                            <div class="mt-2">
                                <input type="text" name="day[]" class="form-control" maxlength="3" minlength="1"
                                       style="width:80px;" placeholder="Day"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                                <div class="day-error"></div>
                            </div>
                        </td>
                        <td><textarea name="workdetail[]" class="form-control" rows="3"></textarea></td>
                        <td><button type="button" class="btn btn-success btn-sm addRow">+</button></td>
                    </tr>
                    </tbody>
                </table>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-save"></i> Update
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
