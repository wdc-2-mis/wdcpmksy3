<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title>Functionaries of Watershed Cell (PPR4)</title>

	<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->
	<style>
		.required {
			color: red;
		}
	</style>


	<script>

		function checkDistrictExists() {

			let district = document.getElementById("district").value;

			if (district === "") {
				return;
			}

			fetch('/checkDistrictExists?dcode=' + district)
				.then(response => response.text())
				.then(result => {
					console.log(result);
					if (result === "EXISTS") {
						alert("This District Data already exists. Please select different Distrinct");

						document.getElementById("district").value = "";
						document.getElementById("district").focus();
					}

				})
				.catch(error => console.error(error));
		}

		// Restrict dates before 2026
		document.addEventListener("DOMContentLoaded", function () {

			const mouDate = document.getElementsByName("MoU")[0];
			mouDate.setAttribute("min", "2026-01-01");

		});

		// Allow only PDF files
		document.addEventListener("DOMContentLoaded", function () {

			const form = document.getElementById("institutionForm");

			const mouFile = document.getElementById("MoUfile");

			function validatePDF(input) {
				if (input.files.length === 0) return true;

				const file = input.files[0];
				const fileName = file.name.toLowerCase();

				if (file.type !== "application/pdf" && !fileName.endsWith(".pdf")) {
					alert("Only PDF files are allowed.");
					input.value = "";
					return false;
				}

				return true;
			}

			mouFile.addEventListener("change", function () {
				if (validatePDF(this)) {
					validateSameFile(this, mouFile);
				}
			});






			form.addEventListener("submit", function (e) {

				const district = document.getElementsByName("district")[0];
				const agency = document.getElementsByName("agency")[0];
				const chairman = document.getElementsByName("chairman")[0];
				const mouDate = document.getElementsByName("MoU")[0];

				const mouFile = document.getElementsByName("MoUfile")[0];


				if (district.value.trim() === "") {
					alert("Please select District.");
					district.focus();
					e.preventDefault();
					return false;
				}

				if (agency.value.trim() === "") {
					alert("Please Enter Executing Agency ");
					agency.focus();
					e.preventDefault();
					return false;
				}

				if (chairman.value.trim() === "") {
					alert("Please Enter Chairman Status");
					chairman.focus();
					e.preventDefault();
					return false;
				}

				// MoU Date
				if (mouDate.value === "") {
					alert("Please select Date of MoU.");
					mouDate.focus();
					e.preventDefault();
					return false;
				}

				// MoU PDF
				if (mouFile.files.length === 0) {
					alert("Please upload MoU PDF.");
					mouFile.focus();
					e.preventDefault();
					return false;
				}

				// Validate PDF type

				const file2 = mouFile.files[0];



				if (!file2.name.toLowerCase().endsWith(".pdf")) {
					alert("MoU file must be a PDF.");
					mouFile.value = "";
					mouFile.focus();
					e.preventDefault();
					return false;
				}

				// Same file validation

			});

		});

	</script>

</head>

<body>





	<div layout:fragment="content">


		<div class="card shadow-sm border-0">

			<div class="card-header bg-primary text-white">
				<h4 class="mb-0">
					Functionaries of Watershed Cell (PPR4)
				</h4>
			</div>

			<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
				<span th:text="${success}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>
			<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
				<span th:text="${error}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<div class="card-body">

				<form id="institutionForm" th:action="@{/savePreliminaryPPR4A}" method="post"
					enctype="multipart/form-data" novalidate>



					<div class="row mb-3">
						<div class="col-md-3">
							<label>District Name</label><span class="required">*</span>
						</div>
						<div class="col-md-5">
							<select id="district" name="district" class="form-select" onchange="checkDistrictExists()">
								<option value="">--Select District--</option>
								<th:block th:each="dist : ${distList}">
									<option th:value="${dist.dcode}" th:text="${dist.distName}">
									</option>
								</th:block>
							</select>

						</div>
					</div>
					<div class="row mb-3">
						<div class="col-md-3">
							<label>Name of Executing Agency</label><span class="required">*</span>
						</div>
						<div class="col-md-5">
							<input type="text" name="agency" id="agency" class="form-control"
								placeholder="Enter Executing Agency" required>

						</div>
					</div>
					<div class="row mb-3">
						<div class="col-md-3">
							<label>Status of Chairman</label><span class="required">*</span>
						</div>
						<div class="col-md-5">
							<input type="text" name="chairman" id="chairman" class="form-control"
								placeholder="Enter Chairman Status" required>

						</div>
					</div>
					<div class="row mb-3">
						<div class="col-md-3">
							<label>Date of Signing of MoU with SLNA</label><span class="required">*</span>
						</div>
						<div class="col-md-5">
							<input type="date" name="MoU" id="MoU" class="form-control" required>

						</div>
					</div>


					<div class="row mb-3">
						<div class="col-md-3">
							<label>Upload MoU</label><span class="required">*</span>
						</div>
						<div class="col-md-5">
							<input type="file" name="MoUfile" id="MoUfile" class="form-control" accept=".pdf" required>

							<small class="text-muted">
								Only PDF file is allowed.
							</small>


						</div>
					</div>


					<div class="text-center mt-4">
						<button type="submit" name="action" value="D" class="btn btn-warning">
							<i class="fas fa-save"></i>
							Save as Draft
						</button>
						<!--<button class="btn btn-primary">
									Submit
								</button>-->
					</div>

				</form>

			</div>

			<div class="table-responsive" th:if="${#lists.size(ppr4List) > 0}">
				<table class="table table-bordered">
					<h4>
						<b>
							<centre> List of Functionaries of Watershed Cell (PPR4) </centre>
						</b>
					</h4>
					<br />
					<tbody>
						<tr>
							<th class="table-primary">District Name</th>
							<th class="table-primary">Name of Executing Agency</th>
							<th class="table-primary">Status of Chairman</th>
							<th class="table-primary">Date of Signing of MoU with SLNA</th>
							<th class="table-primary">Upload MoU</th>
							<th class="table-primary">Action</th>
						</tr>
					</tbody>
					<!--  <tr th:each="user : ${ppr1List}">

				                           <td th:text="${user[2]}"></td>-->

					<tr th:each="user, stat : ${ppr4List}">
						<td th:text="${user[1]}"></td>
						<td th:text="${user[2]}"></td>
						<td th:text="${user[3]}"></td>
						<td th:text="${user[4]}"></td>

						<td>
							<a th:href="@{/viewPdfPreliminaryPPR4A(id=${user[0]})}" target="_blank">
								View MoU
							</a>
						</td>

						<td>
							<a th:if="${user[6].toString().equals('D')}"
								th:href="@{/deletePreliminaryPPR4A(id=${user[0]})}" class="btn btn-danger btn-sm"
								onclick="return confirm('Are you sure you want to delete this record?');">
								<i class="fas fa-trash"></i>
							</a>
							&nbsp; &nbsp;
							<a th:if="${user[6].toString().equals('D')}"
								th:href="@{/editPreliminaryPPR4A(id=${user[0]})}" class="btn btn-primary btn-sm"
								onclick="return confirm('Are you sure you want to edit this record?');">
								<i class="fas fa-edit"></i>
							</a>
							&nbsp; &nbsp;
							<a th:if="${user[6].toString().equals('D')}"
								th:href="@{/completePreliminaryPPR4A(id=${user[0]})}" class="btn btn-success btn-sm"
								onclick="return confirm('Are you sure you want to complete this record?');">
								<i class="fas fa-check"></i>
							</a>
							<span th:if="${user[6].toString().equals('C')}" class="badge bg-success">
								<i class="fas fa-check-circle"></i> Completed
							</span>
						</td>

					</tr>

				</table>

			</div>




		</div>

		</di>

</body>

</html>
