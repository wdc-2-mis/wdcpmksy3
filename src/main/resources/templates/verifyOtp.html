<script>
 // Lightbox with close button
function openImage(src) {
  const lightbox = document.createElement('div');
  lightbox.className = 'lightbox';
  lightbox.innerHTML = `
    <span class="close-btn">&times;</span>
    <img src="${src}">
  `;
  document.body.appendChild(lightbox);

  // Close on click
  lightbox.querySelector('.close-btn').onclick = () => document.body.removeChild(lightbox);
  lightbox.onclick = (e) => {
    if (e.target === lightbox) document.body.removeChild(lightbox);
  };
}

// Government portals auto-cycle
window.onload = function() {
const govGrid = document.getElementById('govGrid');
const portals = govGrid.querySelectorAll('.portal');
let cycle = 0; // 0 = first 5, 1 = next 3

function showPortals() {
  // Hide all first
  portals.forEach(p => p.style.display = 'none');

  if (cycle === 0) {
    // Show first 5
    portals.forEach((p, i) => {
      if (i < 5) p.style.display = 'block';
    });
    cycle = 1;
  } else {
    // Show next 3
    portals.forEach((p, i) => {
      if (i >= 5 && i < 8) p.style.display = 'block';
    });
    cycle = 0;
  }
}

// Initial load
showPortals();

// Auto change every 4 seconds
setInterval(showPortals, 4000);
};
function closeImage(){
    document.getElementById("imageModal").style.display = "none";
}

function scrollToExplore() {
    const section = document.getElementById("explore");

    if (!section) {
        console.error("Explore section not found!");
        return;
    }

    section.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

document.querySelectorAll(".kpi-card").forEach(card => {

    let isDown = false;

    let startX, startY;

    card.addEventListener("mousedown", (e) => {
        isDown = true;
        startX = e.clientX;
        startY = e.clientY;
    });

    document.addEventListener("mouseup", () => {
        isDown = false;
        card.style.transform = "";
    });

    document.addEventListener("mousemove", (e) => {

        if(!isDown) return;

        let moveX = (e.clientX - startX) / 20;
        let moveY = (e.clientY - startY) / 20;

        card.style.transform =
            `translate(${moveX}px, ${moveY}px)
             rotateX(${moveY}deg)
             rotateY(${moveX}deg)`;

    });

});


</script>

<script>

const counters = document.querySelectorAll('.counter');

counters.forEach(counter => {

    const update = () => {

        const target = +counter.getAttribute("data-target");
        const current = +counter.innerText.replace(/,/g,'');

        const step = target / 100;

        if(current < target){

            counter.innerText =
                Math.ceil(current + step).toLocaleString();

            setTimeout(update, 20);

        } else {
            counter.innerText = target.toLocaleString();
        }
    };

    update();
});

function togglePanel(){

    const panel =
        document.getElementById("alertBox");

    panel.style.display =
        panel.style.display === "block"
        ? "none"
        : "block";
}



</script>


<script>

	            e.preventDefault();

	            let email = document.getElementById("email").value;

	            fetch("/sendOtp", {
	                method: "POST",
	                headers: {
	                    "Content-Type": "application/x-www-form-urlencoded"
	                    // Add CSRF token here if required by your backend
	                    // "X-CSRF-TOKEN": token
	                },
	                body: "email=" + encodeURIComponent(email)
	            })
	            .then(response => response.text())
	            .then(data => {
	                document.getElementById("otpMsg").innerText = "The OTP has been resent to your email. ";
	            })
	            .catch(error => console.error(error));
	        });
	    }
	});
</script>
