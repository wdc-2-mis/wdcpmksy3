<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title>Migration Details</title>

	<style>
	.required {
		color: red;
	}

	.validation-error {
		color: red;
		font-size: 14px;
		margin-top: 4px;
	}
				
	.is-invalid {
		border-color: #dc3545 !important;
	}
	.field-error {
		color: red;
		font-size: 14px;
		margin-top: 4px;
	}
	</style>




	<script>

		document.addEventListener("DOMContentLoaded", function () {

			const district = document.getElementById("district");
			const project = document.getElementById("project");
			district.addEventListener("change", function () {
				if (this.value) {
					window.location.href = "/preliminaryPPR15?dcode=" + this.value;
				} else {
					window.location.href = "/preliminaryPPR15";
				}
			});
			project.addEventListener("change", function () {
				if (this.value) {
					window.location.href = "/preliminaryPPR15?dcode=" + district.value + "&&project=" + this.value;
				} else {
					window.location.href = "/preliminaryPPR15";
				}
			});
			
			function showFieldError(field, message) {
				field.classList.add("is-invalid");

				let errorDiv = field.parentElement.querySelector(".field-error");

				if (!errorDiv) {
					errorDiv = document.createElement("div");
					errorDiv.className = "field-error";
					field.parentElement.appendChild(errorDiv);
				}

				errorDiv.textContent = message;
			}

			function clearFieldError(field) {
				field.classList.remove("is-invalid");

				const errorDiv = field.parentElement.querySelector(".field-error");

				if (errorDiv) {
					errorDiv.textContent = "";
				}
			}

			function clearFormErrors(form) {
				form.querySelectorAll(".is-invalid").forEach(function(field) {
					field.classList.remove("is-invalid");
				});

				form.querySelectorAll(".field-error").forEach(function(error) {
					error.textContent = "";
				});
			}

			function validateRequiredField(field, message) {
				if (!field.value || field.value.trim() === "") {
					showFieldError(field, message);
					field.focus();
					return false;
				}

				clearFieldError(field);
				return true;
			}
			function validateDaysMigrating(field) {
				const value = field.value.trim();
				if (value === "") {
					showFieldError(field, "Please enter No. of days per year Migrating.");
					field.focus();
					return false;
				}
				const days = parseInt(value, 10);
				if (days < 1 || days > 365) {
					showFieldError(field, "No. of days per year Migrating cannot be more than 365.");
					field.focus();
					field.value="";
					return false;
				}
				clearFieldError(field);
				return true;
			}

			document.getElementById("ppr15Form").addEventListener("submit", function(event) {
				event.preventDefault();
				const form = this;
				clearFormErrors(form);
				const district = document.getElementById("district");
				const project = document.getElementById("project");
				const watershed = document.getElementById("watershed");
				const village = document.getElementById("village");
				const peopleMigrating = document.getElementById("peopleMigrating");
				const daysMigrating = document.getElementById("daysMigrating");
				const migrationReason = document.getElementById("migrationReason");
				const expectedReduction = document.getElementById("expectedReduction");
				// 1. District
				if (!validateRequiredField(district, "Please select District.")) {
					return;
				}
				// 2. Project
				if (!validateRequiredField(project, "Please select Project.")) {
					return;
				}
				// 3. Micro Watershed
				if (!validateRequiredField(watershed, "Please select Micro Watershed.")) {
					return;
				}
				// 4. Village
				if (!validateRequiredField(village, "Please select Village.")) {
					return;
				}
				// 5. No. of People Migrating
				if (!validateRequiredField(peopleMigrating, "Please enter No. of People Migrating.")) {
					return;
				}
				// 6. No. of days per year Migrating
				if (!validateDaysMigrating(daysMigrating)) {
					return;
				}
				// 7. Major reason(s) for Migration
				if (!validateRequiredField(migrationReason, "Please enter Major reason(s) for Migration.")) {
					return;
				}
				// 8. Expected reduction
				if (!validateRequiredField(expectedReduction, "Please enter Expected reduction.")) {
					return;
				}
				// All validation passed
				form.submit();
			});
			
			document.getElementById("editPpr15Form").addEventListener("submit", function(event) {
				event.preventDefault();
				const form = this;
				clearFormErrors(form);
				const peopleMigrating = document.getElementById("editMigratingPeopleCount");
				const daysMigrating = document.getElementById("editMigrationDaysPerYear");
				const migrationReason = document.getElementById("editMigrationReason");
				const expectedReduction = document.getElementById("editExpectedReduction");
				// 1. No. of People Migrating
				if (!validateRequiredField(peopleMigrating, "Please enter No. of People Migrating.")) {
					return;
				}
				// 2. No. of days per year Migrating
				if (!validateDaysMigrating(daysMigrating)) {
					return;
				}
				// 3. Major reason(s) for Migration
				if (!validateRequiredField(migrationReason, "Please enter Major reason(s) for Migration.")) {
					return;
				}
				// 4. Expected reduction
				if (!validateRequiredField(expectedReduction, "Please enter Expected reduction.")) {
					return;
				}
				// All validation passed
				form.submit();
			});
		
			/* -------------------------------------------------
			    EDIT BUTTON CLICK
			    ------------------------------------------------- */
			document.querySelectorAll(".editBtn").forEach(function(btn) {
			    btn.addEventListener("click", function() {
			        const id = this.getAttribute("data-id");
			        console.log("Editing PPR15 ID:", id);
			        fetch("/getDraftsPPR15?id=" + encodeURIComponent(id))
			            .then(async response => {
			                console.log("Response status:", response.status);
			                console.log("Response URL:", response.url);
			                console.log("Content-Type:", response.headers.get("content-type"));
			                const text = await response.text();
			                console.log("Response body:", text);
			                if (!response.ok) {
			                    throw new Error("HTTP error: " + response.status);
			                }
			                if (!text.trim().startsWith("{")) {
			                    throw new Error("Server did not return JSON object. Response was HTML.");
			                }
			                return JSON.parse(text);
			            })
			            .then(data => {
			                console.log("Edit data:", data);
			                document.getElementById("editPpr15Id").value = data.pprMigrationId;
			                document.getElementById("editPpr15DistrictName").value = data.districtName;
			                document.getElementById("editPpr15ProjectName").value = data.projectName;
			                document.getElementById("editPpr15WatershedName").value = data.microWatershedName;
			                document.getElementById("editPpr15VillageName").value = data.villageName;
			                document.getElementById("editMigratingPeopleCount").value = data.migratingPeopleCount ?? "";
			                document.getElementById("editMigrationDaysPerYear").value = data.migrationDaysPerYear ?? "";
			                document.getElementById("editMigrationReason").value = data.migrationReason ?? "";
			                document.getElementById("editExpectedReduction").value = data.expectedReductionMigratingPeople ?? "";
			            })
			            .catch(error => {
			                console.error("Error loading PPR15 edit details:", error);
			            });
			    });
			});

		});




	</script>

</head>

<body>

	<div layout:fragment="content">

		<div class="container-fluid px-4">

			<div class="card shadow-sm border-0 mt-3">

				<div class="card-header bg-primary text-white">
					<h4 class="mb-0">Migration Details</h4>
				</div>

				<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
					<span th:text="${success}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>
				<div th:if="${error}" class="alert alert-warning alert-dismissible fade show" role="alert">
					<i class="fas fa-exclamation-triangle me-2"></i>
					<strong th:if="${!pprCompleted}">Action Required:</strong>
					<span th:text="${error}"></span>
					<a th:href="@{/pprDistrict}" class="btn btn-sm btn-primary ms-3" th:if="${!pprCompleted}">
						Go to Preliminary Project Report
					</a>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>

				<div class="card-body px-4 py-4">
					<form id="ppr15Form" th:action="@{/saveDraftPPR15}" method="post" novalidate>
						<div class="row mb-4">
							<div class="col-md-2">
								<label class="form-label fw-semibold">State Name:</label><span class="required">*</span>
							</div>
							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" th:value="${statename}" readonly>
							</div>
							<div class="col-md-2">
								<label class="form-label fw-semibold">District Name:</label><span
									class="required">*</span>
							</div>
							<div class="col-md-4">
								<select id="district" name="district" class="form-control form-control-sm" required>
									<option value="">--Select District--</option>
									<th:block th:each="d : ${distList}">
										<option th:value="${d.dcode}" th:text="${d.distName}"
										th:selected="${selectedDistrict != null and selectedDistrict == d.dcode}"></option>
										</option>
									</th:block>
								</select>
								<div class="field-error"></div>
							</div>
						</div>
						<div class="row mb-4">
							<div class="col-md-2">
								<label class="form-label fw-semibold">Project Name:</label><span
									class="required">*</span>
							</div>
							<div class="col-md-4">
								<select id="project" name="pprId" class="form-control form-control-sm">
								    <option value="">--Select Project--</option>
									<option th:each="p : ${pprList}" th:value="${p.pprId}" th:text="${p.projectName}"
										th:selected="${pprId != null and pprId == p.pprId}"> </option>
								</select>
								<div class="field-error"></div>
							</div>
							<div class="col-md-2">
								<label class="form-label fw-semibold">Micro Watershed Name:</label><span
									class="required">*</span>
							</div>
							<div class="col-md-4">
								<select id="watershed" name="watershedId" class="form-control form-control-sm">
								    <option value="">--Select Micro Watershed--</option>
									<option th:each="mw : ${microWatershedList}" th:value="${mw.mwId}" th:text="${mw.mwName}"></option>
								</select>
								<div class="field-error"></div>
							</div>
						</div>
						<div class="row mb-4">
							<div class="col-md-2">
								<label class="form-label fw-semibold">Village Name:</label><span
									class="required">*</span>
							</div>
							<div class="col-md-4">
								<select id="village" name="villageId" class="form-control form-control-sm">
								    <option value="">--Select Village--</option>
									<option th:each="v : ${villageList}" th:value="${v.vcode}" th:text="${v.villageName}"></option>
								</select>
								<div class="field-error"></div>
							</div>
						</div>
						<!-- Row 3 -->
						<div class="row mb-3 align-items-center">
							<div class="col-md-4">
								<label class="form-label fw-semibold">No. of People Migrating<span class="text-danger">*</span></label>
							</div>
							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" id="peopleMigrating" name="peopleMigrating" maxlength="4" 
								inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
								<div class="field-error"></div>
							</div>
						</div>
						<!-- Row 4 -->
						<div class="row mb-3 align-items-center">
							<div class="col-md-4">
								<label class="form-label fw-semibold">No. of days per year Migrating<span class="text-danger">*</span></label>
							</div>
							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" id="daysMigrating" name="daysMigrating" maxlength="3" 
								inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
								<div class="field-error"></div>
							</div>

						</div>
						<!-- Row 5 -->
						<div class="row mb-3 align-items-center">
							<div class="col-md-4">
								<label class="form-label fw-semibold">Major reason(s) for Migration<span class="text-danger">*</span></label>
							</div>
							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" id="migrationReason" name="migrationReason" maxlength="255">
								<div class="field-error"></div>
							</div>
						</div>
						<!-- Row 6 -->
						<div class="row mb-3 align-items-center">
							<div class="col-md-4">
								<label class="form-label fw-semibold">Expected reduction in no. of Persons Migrating<span class="text-danger">*</span></label>
							</div>
							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" id="expectedReduction" name="expectedReduction" maxlength="4" 
								inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
								<div class="field-error"></div>
							</div>
						</div>
						<div class="text-center mt-4">
							<button type="submit" name="action" value="D" class="btn btn-warning" th:disabled="${!pprCompleted}">
								<i class="fas fa-save"></i>
								Save As Draft
							</button>
						</div>
					</form>

					<!-- ================= DRAFT DETAILS ================= -->

					<div class="table-responsive mt-5">

						<h4 class="text-center mb-3">
							<b>Draft Details</b>
						</h4>

						<table class="table table-bordered table-striped table-hover">

							<thead>
								<tr>
									<th class="table-primary">District Name</th>
									<th class="table-primary">Project Name</th>
									<th class="table-primary">Watershed Name</th>
									<th class="table-primary">Village Name</th>
									<th class="table-primary">No. of People Migrating</th>
									<th class="table-primary">No. of days Migrating</th>
									<th class="table-primary">Major reason(s) for Migration</th>
									<th class="table-primary">Expected reduction</th>
									<th class="table-primary text-center" style="min-width:160px;">Action</th>
								</tr>
							</thead>
							<tbody id="draftTableBody">
								<tr th:each="item : ${draftList}">
									<td th:text="${item.ppr.district.distName}"></td>
									<td th:text="${item.ppr.projectName}"></td>
									<td>
										<span th:if="${item.microWatershed != null}" th:text="${item.microWatershed.mwName}"></span>
									</td>
									<td>
										<span th:if="${item.village != null}" th:text="${item.village.villageName}"></span>
									</td>
									<td th:text="${item.migratingPeopleCount}"></td>
									<td th:text="${item.migrationDaysPerYear}"></td>
									<td th:text="${item.migrationReason}"></td>
									<td th:text="${item.expectedReductionMigratingPeople}"></td>
									<td class="text-center">
										<!-- DELETE : Only when Draft -->
										<a th:if="${#strings.trim(item.status) != 'C'}" class="btn btn-danger btn-sm"
											th:onclick="'deleteAlert(\'Are you sure you want to delete this record?\', function() { window.location.href = \'/deletePreliminaryPPR15?id=' + ${item.pprMigrationId} + '\'; }); return false;'">
											<i class="fas fa-trash"></i>
										</a>
										&nbsp;
										<button type="button" class="btn btn-primary btn-sm editBtn" th:data-id="${item.pprMigrationId}" data-bs-toggle="modal"
											data-bs-target="#editModal" th:if="${#strings.trim(item.status) == 'D'}">
											<i class="fas fa-edit"></i>
										</button>
										&nbsp;
										<a th:if="${#strings.trim(item.status) == 'D'}" class="btn btn-success btn-sm"
											th:onclick="'completeAlert(\'Are you sure you want to complete this record??\', function() { window.location.href = \'/completePreliminaryPPR15?id=' + ${item.pprMigrationId} + '\'; }); return false;'">
											<i class="fas fa-check"></i>
										</a>
										<span th:if="${#strings.trim(item.status) == 'C'}" class="badge bg-success">
											<i class="fas fa-check-circle"></i> Completed
										</span>
										<span th:if="${#strings.trim(item.status) == 'S'}" class="badge bg-warning text-dark">
											<i class="fas fa-forward"></i> Skipped
										</span>

									</td>
								</tr>

							</tbody>

						</table>

					</div>
					<!-- ===================== Edit Modal PPR15 ====================== -->

					<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
						<div class="modal-dialog modal-lg">
							<div class="modal-content">
								<div class="modal-header bg-primary text-white">
									<h5 class="modal-title" id="editModalLabel">Edit Migration Details</h5>
									<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
								</div>
								<div class="modal-body">
									<form id="editPpr15Form" th:action="@{/updatePPR15}" method="post">
										<input type="hidden" id="editPpr15Id" name="editPpr15Id">
										<div class="row mb-3">
											<div class="col-md-2 d-flex align-items-center">
												<label>District:</label>
											</div>
											<div class="col-md-3">
												<input type="text" id="editPpr15DistrictName" class="form-control form-control-sm" readonly>
											</div>
											<div class="col-md-2 d-flex align-items-center">
												<label>Project:</label>
											</div>
											<div class="col-md-3">
												<input type="text" id="editPpr15ProjectName" class="form-control form-control-sm" readonly>
											</div>
										</div>
										<div class="row mb-3">
											<div class="col-md-2 d-flex align-items-center">
												<label>Watershed:</label>
											</div>
											<div class="col-md-3">
												<input type="text" id="editPpr15WatershedName" class="form-control form-control-sm" readonly>
											</div>
											<div class="col-md-2 d-flex align-items-center">
												<label>Village:</label>
											</div>
											<div class="col-md-3">
												<input type="text" id="editPpr15VillageName" class="form-control form-control-sm" readonly>
											</div>
										</div>
										<hr>
										<div class="row mb-3">
											<div class="col-md-6 d-flex align-items-center">
												<label>No. of People Migrating:<span class="required">*</span></label>
											</div>
											<div class="col-md-3">
												<input type="text" id="editMigratingPeopleCount" name="editMigratingPeopleCount" class="form-control form-control-sm" maxlength="4" 
												inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
												<div class="validation-error" data-error-for="editMigratingPeopleCount"></div>
											</div>
										</div>
										<div class="row mb-3">
											<div class="col-md-6 d-flex align-items-center">
												<label>No. of days per year Migrating:<span class="required">*</span></label>
											</div>
											<div class="col-md-3">
												<input type="text" id="editMigrationDaysPerYear" name="editMigrationDaysPerYear" class="form-control form-control-sm" maxlength="3" 
												inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
												<div class="validation-error" data-error-for="editMigrationDaysPerYear"></div>
											</div>
										</div>
										<div class="row mb-3">
											<div class="col-md-6 d-flex align-items-center">
												<label>Major reason(s) for Migration:<span class="required">*</span></label>
											</div>
											<div class="col-md-3">
												<input type="text" id="editMigrationReason" name="editMigrationReason" class="form-control form-control-sm" maxlength="500" autocomplete="off">
												<div class="validation-error" data-error-for="editMigrationReason"></div>
											</div>
										</div>
										<div class="row mb-3">
											<div class="col-md-6 d-flex align-items-center">
												<label>Expected reduction:<span class="required">*</span></label>
											</div>
											<div class="col-md-3">
												<input type="text" id="editExpectedReduction" name="editExpectedReduction" class="form-control form-control-sm" maxlength="4" 
												inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
												<div class="validation-error" data-error-for="editExpectedReduction"></div>
											</div>
										</div>
										<div class="text-end">
											<button type="submit" class="btn btn-success">
												<i class="fas fa-save"></i> Update
											</button>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>
					
					
				</div>
			</div>

		</div>

	</div>

</body>

</html>
