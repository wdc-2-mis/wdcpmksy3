<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title>Preliminary Project Report (PPR15)</title>

	<style>
		.required {
			color: red;
		}

		.table th {
			text-align: center;
			vertical-align: middle;
		}

		.table td {
			vertical-align: middle;
		}

		.form-label {
			font-weight: 600;
		}
	</style>




	<script>

		document.addEventListener("DOMContentLoaded", function () {

			const district = document.getElementById("district");
			const project = document.getElementById("project");
			district.addEventListener("change", function () {
				if (this.value) {
					window.location.href = "/preliminaryPPR15?dcode=" + this.value;
				} else {
					window.location.href = "/preliminaryPPR15";
				}
			});
			project.addEventListener("change", function () {
				if (this.value) {
					window.location.href = "/preliminaryPPR15?dcode=" + district.value + "&&project=" + this.value;
				} else {
					window.location.href = "/preliminaryPPR15";
				}
			});

			document.getElementById("ppr15Form").addEventListener("submit", function (event) {
				event.preventDefault();
				// ========= Dropdown Validation =========
				if (document.getElementById("district").value === "") {
					alert("Please select District");
					document.getElementById("district").focus();
					return;
				}
				if (document.getElementById("project").value === "") {
					alert("Please select Project");
					document.getElementById("project").focus();
					return;
				}
				if (document.getElementById("watershed").value === "") {
					alert("Please select Watershed");
					document.getElementById("watershed").focus();
					return;
				}
				if (document.getElementById("village").value === "") {
					alert("Please select Village");
					document.getElementById("village").focus();
					return;
				}
				const form = this;
				const pprId = document.getElementById("project").value;
				fetch(form.getAttribute("action"), {
					method: "POST",
					body: new FormData(form)
				})
					.then(async response => {
						const responseText = await response.text();
						console.log("STATUS:", response.status);
						console.log("URL:", response.url);
						console.log("RESPONSE:", responseText);
						if (!response.ok) {
							throw new Error(
								"Server returned status " + response.status
							);
						}
						return responseText;
					})
					.then(() => {
						console.log("Draft saved successfully");
						/*
						 * Reload the draft table.
						 * This will show both old records and the newly saved record.
						 */
						//loadDraftsPPR15(pprId);
						/*
						 * Clear only the input fields.
						 * Do not clear the table.
						 */
						document.getElementById("peopleMigrating").value = "";
						document.getElementById("daysMigrating").value = "";
						document.getElementById("migrationReason").value = "";
						document.getElementById("expectedReduction").value = "";
					})
					.catch(error => {
						console.error("SAVE ERROR:", error);
						alert("Error while saving draft.");
					});
			});
		});

		function loadDraftsPPR15(pprId) {
			const tableBody = document.getElementById("draftTableBody");
			tableBody.innerHTML = "";
			if (!pprId) {
				return;
			}
			fetch('/getDraftsPPR15?pprId=' + pprId)
				.then(response => response.json())
				.then(data => {
					data.forEach(function (item) {
						const row = document.createElement("tr");
						row.innerHTML = `
	                    <td>${item.dist_name}</td>
	                    <td>${item.project_name}</td>
	                    <td>${item.mw_name ?? ""}</td>
	                    <td>${item.village_name ?? ""}</td>
	                    <td>${item.migrating_people_count}</td>
	                    <td>${item.migration_days_per_year}</td>
	                    <td>${item.migration_reason}</td>
	                    <td>${item.expected_reduction_migrating_people}</td>
	                    <td class="text-center">
	                        ${item.status === 'D' ? `<a href="/deletePreliminaryPPR15?id=${item.ppr_migration_id}" class="btn btn-danger btn-sm"
	                               onclick="return confirm('Are you sure you want to delete this record?')">
	                                <i class="fas fa-trash"></i>
	                            </a>
	                            &nbsp;
	                            <button type="button"
	                                    class="btn btn-primary btn-sm ppr15-edit-btn"
	                                    title="Edit"
	                                    data-id="${item.ppr_migration_id}"
	                                    data-districtname="${item.dist_name}"
	                                    data-projectname="${item.project_name}"
	                                    data-pprid="${item.ppr_id}"
	                                    data-watershedname="${item.mw_name}"
	                                    data-mwid="${item.mw_id}"
	                                    data-villagename="${item.tem.vcode}"
	                                    data-people="${village_name}"
	                                    data-vcode="${iitem.migrating_people_count}"
	                                    data-days="${item.migration_days_per_year}"
	                                    data-reason="${item.migration_reason}"
	                                    data-reduction="${item.expected_reduction_migrating_people}">
	                                <i class="fas fa-edit"></i>
	                            </button>
	                            &nbsp;
	                            <a href="/completePreliminaryPPR15?id=${item.ppr_migration_id}"
	                               class="btn btn-success btn-sm"
	                               onclick="return confirm('Are you sure you want to complete this record?')">
	                                <i class="fas fa-check"></i>
	                            </a>
	                            ` : `<span class="badge bg-success"> <i class="fas fa-check-circle"></i> Data Completed </span> `
							}
	                    </td>
	                `;

						tableBody.appendChild(row);
					});

				})
				.catch(error => {
					console.error("Error loading PPR15 drafts:", error);
				});
		}


		/* ==========================================================
			   PPR15 : Edit Popup Function
			   ========================================================== */

		//document.addEventListener("click", function (e) {
			//const btn = e.target.closest(".ppr15-edit-btn");
			//document.getElementById("editPpr15Id").value = btn.dataset.id;
			//console.log("Clicked PPR15 Edit Button:", btn);
			//if (!btn) {
			//	return;
			//}
			//document.getElementById("editPpr15Id").value =btn.dataset.id;
			//console.log("PPR ID =", btn.dataset.id);
			//document.getElementById("editPpr15DistrictName").value =btn.dataset.districtname;
		//	document.getElementById("editPpr15District").value = btn.dataset.dcode;
		//	document.getElementById("editPpr15ProjectName").value = btn.dataset.projectname;
		//	document.getElementById("editPpr15Project").value = btn.dataset.pprid;
		//	document.getElementById("editPpr15WatershedName").value = btn.dataset.watershedname;
		//	document.getElementById("editPpr15Watershed").value = btn.dataset.mwid;
		//	document.getElementById("editPpr15VillageName").value = btn.dataset.villagename;
		//	document.getElementById("editPpr15Village").value = btn.dataset.vcode;
		//	document.getElementById("editMigratingPeopleCount").value = btn.dataset.people;
		//	document.getElementById("editMigrationDaysPerYear").value = btn.dataset.days;
		//	document.getElementById("editMigrationReason").value = btn.dataset.reason;
		//	document.getElementById("editExpectedReduction").value = btn.dataset.reduction;
		//	new bootstrap.Modal(document.getElementById("editModalPPR15")).show();
		//});


	</script>

</head>

<body>

	<div layout:fragment="content">

		<div class="container-fluid px-4">

			<div class="card shadow-sm border-0 mt-3">

				<div class="card-header bg-primary text-white">
					<h4 class="mb-0">Migration Details (PPR15)</h4>
				</div>

				<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
					<span th:text="${success}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>
				<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
					<span th:text="${error}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>

				<div class="card-body px-4 py-4">

					<form id="ppr15Form" th:action="@{/saveDraftPPR15}" method="post" novalidate>

						<div class="row mb-4">
							<div class="col-md-2">
								<label class="form-label fw-semibold">State Name:</label><span class="required">*</span>
							</div>
							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" th:value="${statename}"
									readonly>
							</div>

							<div class="col-md-2">
								<label class="form-label fw-semibold">District Name:</label><span
									class="required">*</span>
							</div>
							<div class="col-md-4">
								<select id="district" name="district" class="form-control form-control-sm" required>
									<option value="">--Select District--</option>
									<th:block th:each="d : ${distList}">
										<option th:value="${d.dcode}" th:text="${d.distName}"
										th:selected="${selectedDistrict != null and selectedDistrict == d.dcode}"></option>
										</option>
									</th:block>
								</select>
							</div>
						</div>

						<div class="row mb-4">
							<div class="col-md-2">
								<label class="form-label fw-semibold">Project Name:</label><span
									class="required">*</span>
							</div>
							<div class="col-md-4">
								<select id="project" name="pprId" class="form-control form-control-sm" required>
								    <option value="">--Select Project--</option>
									<option th:each="p : ${pprList}" th:value="${p.pprId}" th:text="${p.projectName}"
										th:selected="${pprId != null and pprId == p.pprId}"> </option>
								</select>
							</div>

							<div class="col-md-2">
								<label class="form-label fw-semibold">Micro Watershed Name:</label><span
									class="required">*</span>
							</div>
							<div class="col-md-4">
								<select id="watershed" name="watershedId" class="form-control form-control-sm" required>
								    <option value="">--Select Micro Watershed--</option>
									<option th:each="mw : ${microWatershedList}" th:value="${mw.mwId}" th:text="${mw.mwName}"></option>
								</select>
							</div>
						</div>

						<div class="row mb-4">
							<div class="col-md-2">
								<label class="form-label fw-semibold">Village Name:</label><span
									class="required">*</span>
							</div>
							<div class="col-md-4">
								<select id="village" name="villageId" class="form-control form-control-sm" required>
								    <option value="">--Select Village--</option>
									<option th:each="v : ${villageList}" th:value="${v.vcode}" th:text="${v.villageName}"></option>
								</select>
							</div>
						</div>

						<!-- Row 3 -->
						<div class="row mb-3 align-items-center">

							<div class="col-md-4">
								<label class="form-label fw-semibold">
									No. of People Migrating
									<span class="text-danger">*</span>
								</label>
							</div>

							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" id="peopleMigrating"
									name="peopleMigrating" maxlength="10" required>
							</div>

						</div>

						<!-- Row 4 -->
						<div class="row mb-3 align-items-center">

							<div class="col-md-4">
								<label class="form-label fw-semibold">
									No. of days per year Migrating
									<span class="text-danger">*</span>
								</label>
							</div>

							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" id="daysMigrating"
									name="daysMigrating" maxlength="10" required>
							</div>

						</div>

						<!-- Row 5 -->
						<div class="row mb-3 align-items-center">

							<div class="col-md-4">
								<label class="form-label fw-semibold">
									Major reason(s) for Migration
									<span class="text-danger">*</span>
								</label>
							</div>

							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" id="migrationReason"
									name="migrationReason" maxlength="255" required>
							</div>

						</div>

						<!-- Row 6 -->
						<div class="row mb-3 align-items-center">

							<div class="col-md-4">
								<label class="form-label fw-semibold">
									Expected reduction in no. of Persons Migrating
									<span class="text-danger">*</span>
								</label>
							</div>

							<div class="col-md-4">
								<input type="text" class="form-control form-control-sm" id="expectedReduction"
									name="expectedReduction" maxlength="10" required>
							</div>

						</div>

						<input type="hidden" name="action" value="D">

						<div class="mt-4" style="position: relative;">

						    <div class="text-center">
						        <button type="submit" class="btn btn-warning px-4 fw-semibold">
						            <i class="fa fa-save me-1"></i> Save as Draft
						        </button>
						<!---------   </div>

						    <a th:href="@{/pprWaterOutcomes}" class="btn btn-outline-secondary"
						        style="position: absolute; right: 0; top: 50%; transform: translateY(-50%);">
						        Skip <i class="fas fa-arrow-right"></i>
						    </a>

						</div>--------->
					</form>

					<!-- ================= DRAFT DETAILS ================= -->

					<div class="table-responsive mt-5">

						<h4 class="text-center mb-3">
							<b>Draft Details</b>
						</h4>

						<table class="table table-bordered table-striped table-hover">

							<thead>
								<tr>
									<th class="table-primary">District Name</th>
									<th class="table-primary">Project Name</th>
									<th class="table-primary">Watershed Name</th>
									<th class="table-primary">Village Name</th>
									<th class="table-primary">No. of People Migrating</th>
									<th class="table-primary">No. of days Migrating</th>
									<th class="table-primary">Major reason(s) for Migration</th>
									<th class="table-primary">Expected reduction</th>
									<th class="table-primary text-center" style="min-width:160px;">Action</th>
								</tr>
							</thead>

							<tbody id="draftTableBody">

								<tr th:each="item : ${draftList}">

									<td th:text="${item.ppr.district.distName}"></td>

									<td th:text="${item.ppr.projectName}"></td>

									<td th:text="${item.watershed.watershedName}"></td>

									<td th:text="${item.village.villageName}"></td>

									<td th:text="${item.peopleMigrating}"></td>

									<td th:text="${item.daysMigrating}"></td>

									<td th:text="${item.migrationReason}"></td>

									<td th:text="${item.expectedReduction}"></td>

									<td class="text-center">

										<!-- DELETE : Only when Draft -->
										<a th:if="${item.status.toString().equals('D')}"
											th:href="@{/deletePreliminaryPPR15(id=${item.pprMigrationId})}"
											class="btn btn-danger btn-sm"
											onclick="return confirm('Are you sure you want to delete this record?')">
											<i class="fas fa-trash"></i>
										</a>

										&nbsp;

										<!-- EDIT : Only when Draft -->
										<button th:if="${item.status.toString().equals('D')}" type="button"
											class="btn btn-primary btn-sm ppr15-edit-btn" title="Edit"
											th:data-id="${item.pprMigrationId}"
											th:data-districtname="${item.ppr.district.distName}"
											th:data-dcode="${item.ppr.district.dcode}"
											th:data-projectname="${item.ppr.projectName}"
											th:data-pprid="${item.ppr.pprId}"
											th:data-watershedname="${item.watershed.watershedName}"
											th:data-mwid="${item.mwId}"
											th:data-villagename="${item.village.villageName}"
											th:data-vcode="${item.vcode}" th:data-people="${item.peopleMigrating}"
											th:data-days="${item.daysMigrating}"
											th:data-reason="${item.migrationReason}"
											th:data-reduction="${item.expectedReduction}">
											<i class="fas fa-edit"></i>
										</button>

										&nbsp;

										<!-- COMPLETE : Only when Draft -->
										<a th:if="${item.status.toString().equals('D')}"
											th:href="@{/completePreliminaryPPR15(id=${item.pprMigrationId})}"
											class="btn btn-success btn-sm"
											onclick="return confirm('Are you sure you want to complete this record?')">
											<i class="fas fa-check"></i>
										</a>

										<!-- COMPLETED BADGE -->
										<span th:if="${item.status.toString().equals('C')}" class="badge bg-success">
											<i class="fas fa-check-circle"></i> Completed
										</span>

									</td>
								</tr>

							</tbody>

						</table>

					</div>
					<!-- ===================== Edit Modal PPR15 ====================== -->

					<div class="modal fade" id="editModalPPR15">

						<div class="modal-dialog modal-lg">

							<div class="modal-content">

								<!-- Modal Header -->
								<div class="modal-header bg-primary text-white">

									<h5 class="modal-title">
										Edit Migration Details (PPR15)
									</h5>

									<button type="button" class="btn-close" data-bs-dismiss="modal">
									</button>

								</div>


								<!-- Modal Body -->
								<div class="modal-body">

									<form id="editPpr15Form" th:action="@{/updatePPR15}" method="post">

										<!-- Hidden Record ID -->
										<input type="hidden" id="editPpr15Id" name="editPpr15Id">


										<!-- ========================= ROW 1 ========================= -->

										<div class="row mb-3">

											<!-- District -->
											<div class="col-md-2">

												<label class="form-label">
													District
													<span class="required">*</span>
												</label>

											</div>

											<div class="col-md-4">

												<input type="text" class="form-control" id="editPpr15DistrictName"
													readonly>

												<input type="hidden" id="editPpr15District" name="dcode">

											</div>


											<!-- Project -->
											<div class="col-md-2">

												<label class="form-label">
													Project
													<span class="required">*</span>
												</label>

											</div>

											<div class="col-md-4">

												<input type="text" class="form-control" id="editPpr15ProjectName"
													readonly>

												<input type="hidden" id="editPpr15Project" name="pprId">

											</div>

										</div>


										<!-- ========================= ROW 2 ========================= -->

										<div class="row mb-3">

											<!-- Watershed -->
											<div class="col-md-2">

												<label class="form-label">
													Watershed
													<span class="required">*</span>
												</label>

											</div>

											<div class="col-md-4">

												<input type="text" class="form-control" id="editPpr15WatershedName"
													readonly>

												<input type="hidden" id="editPpr15Watershed" name="mwId">

											</div>


											<!-- Village -->
											<div class="col-md-2">

												<label class="form-label">
													Village
													<span class="required">*</span>
												</label>

											</div>

											<div class="col-md-4">

												<input type="text" class="form-control" id="editPpr15VillageName"
													readonly>

												<input type="hidden" id="editPpr15Village" name="vcode">

											</div>

										</div>


										<!-- ========================= ROW 3 ========================= -->

										<div class="row mb-3">

											<!-- People Migrating -->
											<div class="col-md-6">

												<label class="form-label">
													No. of People Migrating
													<span class="required">*</span>
												</label>

												<input type="text" class="form-control" id="editMigratingPeopleCount"
													name="editMigratingPeopleCount" maxlength="10"
													oninput="validateInteger(this,10)">

											</div>


											<!-- Days -->
											<div class="col-md-6">

												<label class="form-label">
													No. of days per year Migrating
													<span class="required">*</span>
												</label>

												<input type="text" class="form-control" id="editMigrationDaysPerYear"
													name="editMigrationDaysPerYear" maxlength="10"
													oninput="validateInteger(this,10)">

											</div>

										</div>


										<!-- ========================= ROW 4 ========================= -->

										<div class="row mb-3">

											<!-- Migration Reason -->
											<div class="col-md-6">

												<label class="form-label">
													Major reason(s) for Migration
													<span class="required">*</span>
												</label>

												<input type="text" class="form-control" id="editMigrationReason"
													name="editMigrationReason" maxlength="500">

											</div>


											<!-- Expected Reduction -->
											<div class="col-md-6">

												<label class="form-label">
													Expected reduction in no. of Persons Migrating
													<span class="required">*</span>
												</label>

												<input type="text" class="form-control" id="editExpectedReduction"
													name="editExpectedReduction" maxlength="10"
													oninput="validateInteger(this,10)">

											</div>

										</div>


										<!-- ========================= BUTTONS ========================= -->

										<div class="row mt-4">

											<div class="col-12 text-center">

												<button type="submit" class="btn btn-success px-4">

													<i class="fa fa-save me-1"></i>
													Update

												</button>


												<button type="button" class="btn btn-secondary px-4 ms-2"
													data-bs-dismiss="modal">

													Cancel

												</button>

											</div>

										</div>

									</form>

								</div>

							</div>

						</div>

					</div>
				</div>

			</div>

		</div>

	</div>

</body>

</html>
