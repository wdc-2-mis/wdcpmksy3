<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title>Details of SLNA</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
	.required{
	    color:red;
	}

	.field-error{
	    color:red;
	    font-size:13px;
	    margin-top:4px;
	    display:block;
	}

	.is-invalid{
	    border-color:#dc3545 !important;
	}

	.radio-error{
	    color:red;
	    font-size:13px;
	    margin-top:4px;
	    display:block;
	}
	</style>
<script th:inline="javascript">

	// Restrict dates before 2025
	document.addEventListener("DOMContentLoaded", function () {
		const appointmentDate = document.getElementsByName("appointmentDate")[0];
		appointmentDate.setAttribute("min", "2026-01-01");
		
		const today = new Date().toISOString().split("T")[0]; 
			appointmentDate.setAttribute("max", today); 
			mouDate.setAttribute("max", today);

	});
	
	document.addEventListener("DOMContentLoaded", function () {

	    const selectAll = document.getElementById("selectAll");
	    const rowCheckboxes = document.querySelectorAll(".rowCheckbox");

	    // Select/Deselect all rows
	    selectAll.addEventListener("change", function () {
	        rowCheckboxes.forEach(function (checkbox) {
	            checkbox.checked = selectAll.checked;
	        });
	    });

	    // Update header checkbox when any row checkbox changes
	    rowCheckboxes.forEach(function (checkbox) {
	        checkbox.addEventListener("change", function () {

	            const total = rowCheckboxes.length;
	            const checked = document.querySelectorAll(".rowCheckbox:checked").length;

	            selectAll.checked = (total === checked);
	        });
	    });

	});
	
	document.addEventListener("DOMContentLoaded", function () {

			document.querySelectorAll(".editBtn").forEach(button => {

				button.addEventListener("click", function () {

					let id = this.dataset.id;
					fetch("/getDetailsOfSLNAById?id=" + id)
						.then(response => response.json())
						.then(data => {
							const editForm = document.getElementById("editForm");
							editForm.querySelectorAll("input[name='memberType']").forEach(radio => {
							    radio.checked = (radio.value == data.memberId);
							});
							
							document.getElementById("pprSlna").value = data.pprSlnaId;

							document.getElementById("firstName").value = data.firstName;

							document.getElementById("lastName").value = data.lastName;

							document.getElementById("designation").value = data.designationId;

							document.getElementById("qualification").value = data.qualificationId;

							document.getElementById("appointmentDate").value = data.appointmentDate;

							document.getElementById("tenure").value = data.tenurePeriodYr;

							document.getElementById("phoneNo").value = data.phoneNo;

							document.getElementById("emailId").value = data.emailId;

							document.getElementById("fax").value = data.fax;

							if (data.joiningType == "F")
								document.getElementById("joiningFull").checked = true;
							else
								document.getElementById("joiningPart").checked = true;

						});

				});

			});
	});
	
	document.addEventListener("DOMContentLoaded", function () {
	    const forms = document.querySelectorAll("#saveForm, #editForm");
	    forms.forEach(form => {
	        const firstName = form.querySelector("input[name='firstName']");
	        const lastName = form.querySelector("input[name='lastName']");
	        const designation = form.querySelector("select[name='designation']");
	        const qualification = form.querySelector("select[name='qualification']");
	        const appointmentDate = form.querySelector("input[name='appointmentDate']");
	        const tenure = form.querySelector("input[name='tenure']");
	        const phone = form.querySelector("input[name='phone']");
	        const email = form.querySelector("input[name='email']");
	        const memberRadios = form.querySelectorAll("input[name='memberType']");
	        const joiningRadios = form.querySelectorAll("input[name='joiningType']");

			function showError(field, message) {
			            if (!field) return;
			            field.classList.add("is-invalid");
			            const error = form.querySelector("[data-error-for='" + field.name + "']");
			            if (error) error.textContent = message;
			        }

			        function clearError(field) {
			            if (!field) return;
			            field.classList.remove("is-invalid");
			            const error = form.querySelector("[data-error-for='" + field.name + "']");
			            if (error) error.textContent = "";
			        }

			        function showRadioError(name, message) {
			            const error = form.querySelector("[data-error-for='" + name + "']");
			            if (error) error.textContent = message;
			        }

			        function clearRadioError(name) {
			            const error = form.querySelector("[data-error-for='" + name + "']");
			            if (error) error.textContent = "";
			        }

			        function validateField(field) {
			            if (!field) return true;
			            const value = field.value.trim();
			            clearError(field);

			            if (field.name === "firstName") {
			                if (!value) {
			                    showError(field, "First Name is required.");
			                    return false;
			                }
			                if (!/^[A-Za-z ]+$/.test(value)) {
			                    showError(field, "First Name should contain only letters.");
			                    return false;
			                }
			                if (value.length < 2) {
			                    showError(field, "First Name must be at least 2 characters.");
			                    return false;
			                }
			            }

			            if (field.name === "lastName") {
			                if (!value) {
			                    showError(field, "Last Name is required.");
			                    return false;
			                }
			                if (!/^[A-Za-z ]+$/.test(value)) {
			                    showError(field, "Last Name should contain only letters.");
			                    return false;
			                }
			                if (value.length < 2) {
			                    showError(field, "Last Name must be at least 2 characters.");
			                    return false;
			                }
			            }

			            if (field.name === "designation") {
			                if (!value) {
			                    showError(field, "Please select a Designation.");
			                    return false;
			                }
			            }

			            if (field.name === "qualification") {
			                if (!value) {
			                    showError(field, "Please select a Qualification.");
			                    return false;
			                }
			            }

			            if (field.name === "appointmentDate") {
			                if (!value) {
			                    showError(field, "Appointment Date is required.");
			                    return false;
			                }
			                const selectedDate = new Date(value);
			                const minDate = new Date("2026-01-01");
			                const today = new Date();
			                selectedDate.setHours(0, 0, 0, 0);
			                minDate.setHours(0, 0, 0, 0);
			                today.setHours(0, 0, 0, 0);
			                if (selectedDate < minDate) {
			                    showError(field, "Appointment Date cannot be before 01-01-2026.");
			                    return false;
			                }
			                if (selectedDate > today) {
			                    showError(field, "Appointment Date cannot be a future date.");
			                    return false;
			                }
			            }

			            if (field.name === "tenure") {
			                if (!value) {
			                    showError(field, "Tenure Period is required.");
			                    return false;
			                }
			                if (!/^\d+$/.test(value)) {
			                    showError(field, "Tenure Period must contain numbers only.");
			                    return false;
			                }
			                const tenureValue = parseInt(value);
			                if (tenureValue < 1 || tenureValue > 99) {
			                    showError(field, "Tenure Period must be between 1 and 99 years.");
			                    return false;
			                }
			            }

			            if (field.name === "phone") {
			                if (!value) {
			                    showError(field, "Phone number is required.");
			                    return false;
			                }
			                if (!/^[0-9]{10}$/.test(value)) {
			                    showError(field, "Phone number must contain exactly 10 digits.");
			                    return false;
			                }
			                if (!/^[6-9]/.test(value)) {
			                    showError(field, "Phone number must start with 6, 7, 8 or 9.");
			                    return false;
			                }
			                const currentId = form.querySelector("input[name='pprSlna']")?.value || "";
			                if (isDuplicatePhone(value, currentId)) {
			                    showError(field, "This phone number is already saved for another Member.");
			                    return false;
			                }
			            }

			            if (field.name === "email") {
			                if (!value) {
			                    showError(field, "Email is required.");
			                    return false;
			                }
			                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
			                if (!emailPattern.test(value)) {
			                    showError(field, "Please enter a valid email address.");
			                    return false;
			                }
			                const currentId = form.querySelector("input[name='pprSlna']")?.value || "";
			                if (isDuplicateEmail(value, currentId)) {
			                    showError(field, "This email is already saved for another Member.");
			                    return false;
			                }
			            }

			            return true;
			        }

	        form.addEventListener("submit", function (event) {
	            event.preventDefault();
	            if (memberRadios.length && ![...memberRadios].some(r => r.checked)) {
	                showRadioError("memberType", "Please select a Member Type.");
	                memberRadios[0].focus();
	                return;
	            }
	            clearRadioError("memberType");
	            if (firstName && !validateField(firstName)) {
	                firstName.focus();
	                return;
	            }
	            if (lastName && !validateField(lastName)) {
	                lastName.focus();
	                return;
	            }
	            if (designation && !validateField(designation)) {
	                designation.focus();
	                return;
	            }
	            if (qualification && !validateField(qualification)) {
	                qualification.focus();
	                return;
	            }
	            if (appointmentDate && !validateField(appointmentDate)) {
	                appointmentDate.focus();
	                return;
	            }
	            if (joiningRadios.length && ![...joiningRadios].some(r => r.checked)) {
	                showRadioError("joiningType", "Please select Nature of Appointment.");
	                joiningRadios[0].focus();
	                return;
	            }
	            clearRadioError("joiningType");
	            if (tenure && !validateField(tenure)) {
	                tenure.focus();
	                return;
	            }
	            if (phone && !validateField(phone)) {
	                phone.focus();
	                return;
	            }
	            if (email && !validateField(email)) {
	                email.focus();
	                return;
	            }
	            form.submit();
	        });
	    });
	});
	
	const chairpersonExists = /*[[${chairpersonExists}]]*/ false;
	const ceoExists = /*[[${ceoExists}]]*/ false;
	const phoneMap = /*[[${phoneMap}]]*/ {};
	const emailMap = /*[[${emailMap}]]*/ {};
	document.addEventListener("DOMContentLoaded", function () {
	    const saveButton = document.querySelector("button[name='action'][value='D']");
		const updateButton = document.querySelector("button[name='updateAction'][value='D']");
	    const memberRadios = document.querySelectorAll("input[name='memberType']");
		
		const phoneInputs = document.querySelectorAll("input[name='phone']");
		const emailInputs = document.querySelectorAll("input[name='email']");

	    memberRadios.forEach(radio => {
	        radio.addEventListener("change", function () {
				phoneInputs.forEach(phoneInput => {
					phoneInput.value = "";
				});
				emailInputs.forEach(emailInput => {
					emailInput.value = "";
				});
	            const selectedText = this.nextElementSibling.textContent.trim();
				
	            if (chairpersonExists && selectedText === "Chairperson") {
	                saveButton.disabled = true;
					updateButton.disabled = true;
	                alert(selectedText + " details for this SLNA is already saved. You cannot save again.");
	            } else if (ceoExists && selectedText === "CEO") {
					saveButton.disabled = true;
					updateButton.disabled = true;
					alert(selectedText + " details for this SLNA is already saved. You cannot save again.");
				} else{
	                saveButton.disabled = false;
					updateButton.disabled = false;
	            }
	        });
	    });
		function isMemberSelected(form) {
			const selected = form.querySelector("input[name='memberType']:checked");
			return selected && selected.nextElementSibling.textContent.trim() === "Member";
		}
		
		function isDuplicatePhone(phone, currentId) {
		    return Object.entries(phoneMap).some(([id, value]) =>
		        value === phone && String(id) !== String(currentId)
		    );
		}

		function isDuplicateEmail(email, currentId) {
		    return Object.entries(emailMap).some(([id, value]) =>
		        value === email && String(id) !== String(currentId)
		    );
		}
		phoneInputs.forEach(phoneInput => {
		    phoneInput.addEventListener("blur", function () {
		        const form = phoneInput.closest("form");
		        if (!isMemberSelected(form))
		            return;
		        const phone = phoneInput.value.trim();
		        if (!phone)
		            return;
		        const currentId =
		            form.querySelector("input[name='pprSlna']")?.value || "";
		        if (isDuplicatePhone(phone, currentId)) {
		            alert("This phone number is already saved for another Member.");
		            phoneInput.value = "";
		            phoneInput.focus();
		        }
		    });
		});

		emailInputs.forEach(emailInput => {
		    emailInput.addEventListener("blur", function () {
		        const form = emailInput.closest("form");
		        if (!isMemberSelected(form))
		            return;
		        const email = emailInput.value.trim();
		        if (!email)
		            return;
		        const currentId =
		            form.querySelector("input[name='pprSlna']")?.value || "";
		        if (isDuplicateEmail(email, currentId)) {
		            alert("This email is already saved for another Member.");
		            emailInput.value = "";
		            emailInput.focus();
		        }
		    });
		});
	});
	
	
</script>
	

</head>
<body>
	<div layout:fragment="content">

	    <div class="card shadow-sm border-0">
	        <div class="card-header bg-primary text-white">
	            <h4 class="mb-0">
	               Details of SLNA
	            </h4>
	        </div>
			<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
				<span th:text="${success}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>
	        <div class="card-body">
	            <form id="saveForm" th:action="@{/saveDetailsOfSLNA}" method="post">
	                <!-- Member Details -->
	                <div class="row mb-3 align-items-center">
	                    <label class="col-md-3 fw-bold"> Member Details <span class="required">*</span></label>
						<input type="hidden" name="stcode"  th:value="${stcode}" >
	                    <div class="col-md-9">
	                        <div class="form-check form-check-inline" th:each="member : ${memberDetailsList}">
	                            <input class="form-check-input" type="radio" name="memberType" th:id="'member'+${member.memberId}" th:value="${member.memberId}" />
	                            <label class="form-check-label" th:for="'member'+${member.memberId}" th:text="${member.memberType}"> </label>
	                        </div>
							<div class="field-error" data-error-for="memberType"></div>
	                    </div>
	                </div>

					<div class="row mb-3 align-items-center">
					    <label class="col-md-3 fw-bold">Name <span class="required">*</span></label>
					    <div class="col-md-4">
					        <input type="text" class="form-control" name="firstName" placeholder="First Name">
							<div class="field-error" data-error-for="firstName"></div>
					    </div>
					    <div class="col-md-4">
					        <input type="text" class="form-control" name="lastName" placeholder="Last Name">
							<div class="field-error" data-error-for="lastName"></div>
					    </div>
					</div>

	                <div class="row mb-3 align-items-center">
	                    <label class="col-md-3 fw-bold">Designation <span class="required">*</span></label>
	                    <div class="col-md-5">
	                        <select class="form-select" name="designation">
	                            <option value="">--Select--</option>
	                            <option th:each="d : ${designationList}" th:value="${d.designationId}" th:text="${d.designationName}"> </option>
	                        </select>
							<div class="field-error" data-error-for="designation"></div>
	                    </div>
	                </div>

	                <div class="row mb-3 align-items-center">
	                    <label class="col-md-3 fw-bold">Qualification <span class="required">*</span></label>
	                    <div class="col-md-5">
	                        <select class="form-select" name="qualification">
	                            <option value="">--Select--</option>
	                            <option th:each="q : ${qualificationList}" th:value="${q.qualificationId}" th:text="${q.qualificationName}"> </option>
	                        </select>
							<div class="field-error" data-error-for="qualification"></div>
	                    </div>
	                </div>

	                <div class="row mb-3 align-items-center">
	                    <label class="col-md-3 fw-bold">Appointment Date <span class="required">*</span></label>
	                    <div class="col-md-4">
	                        <input type="date" class="form-control" name="appointmentDate" min="2026-01-01" th:value="${appointmentDate}" onkeydown="return false;">
							<div class="field-error" data-error-for="appointmentDate"></div>
	                    </div>
	                </div>
					
	                <div class="row mb-3 align-items-center">
	                    <label class="col-md-3 fw-bold"> Nature of Appointment <span class="required">*</span></label>
	                    <div class="col-md-9">
	                        <div class="form-check form-check-inline">
	                            <input class="form-check-input" type="radio" name="joiningType" value="F">
	                            <label class="form-check-label"> Full Time </label>
	                        </div>
	                        <div class="form-check form-check-inline">
	                            <input class="form-check-input" type="radio" name="joiningType" value="P">
	                            <label class="form-check-label"> Part Time </label>
	                        </div>
							<div class="radio-error" data-error-for="joiningType"></div>
	                    </div>
	                </div>

	                <div class="row mb-3 align-items-center">
	                    <label class="col-md-3 fw-bold"> Tenure Period (in years) <span class="required">*</span></label>
	                    <div class="col-md-3">
	                        <input type="text" class="form-control" name="tenure" oninput="validateInteger(this,2)">
							<div class="field-error" data-error-for="tenure"></div>
	                    </div>
	                </div>
					
	                <div class="row mb-3 align-items-center">
	                    <label class="col-md-3 fw-bold"> Phone No <span class="required">*</span></label>
	                    <div class="col-md-4">
	                        <input type="text" class="form-control" name="phone" oninput="validateInteger(this,10)">
							<div class="field-error" data-error-for="phone"></div>
	                    </div>
	                </div>

	                <div class="row mb-3 align-items-center">
	                    <label class="col-md-3 fw-bold"> Email <span class="required">*</span></label>
	                    <div class="col-md-5">
	                        <input type="email" class="form-control" name="email">
							<div class="field-error" data-error-for="email"></div>
	                    </div>
	                </div>

	                <div class="row mb-4 align-items-center">
	                    <label class="col-md-3 fw-bold"> Fax </label>
	                    <div class="col-md-4">
	                        <input type="text" class="form-control" name="fax">
	                    </div>
	                </div>

					<div class="text-center mt-4">
						<button type="submit" name="action"  value="D" class="btn btn-warning">
					         <i class="fas fa-save"></i>
					          Save As Draft
					     </button>
	                </div>

	            </form>
			</div>
		</div>
		<br/>
		<div th:if="${detailsOfSLNAList != null}">
		    <table class="table table-bordered table-striped table-hover">
		        <h4> <b><center>List of Save As Draft SLNA Details</center></b> </h4>
		        <br/>
		        <thead class="table-primary">
		        <tr>
		            <th>Member Details</th>
		            <th>Name</th>
		            <th>Designation</th>
		            <th>Qualification</th>
		            <th>Appointment Date</th>
		            <th>Nature of Appointment</th>
		            <th>Tenure(in years)</th>
		            <th>Phone</th>
		            <th>Email</th>
		            <th>Fax</th>
		            <th>Action</th>
		        </tr>
		        </thead>
		        <tbody>
		        <tr th:each="data : ${detailsOfSLNAList}">
		            <td th:text="${data.member.memberType}"></td>
		            <td th:text="${data.firstName+' '+data.lastName}"></td>
		            <td th:text="${data.designation.designationName}"></td>
		            <td th:text="${data.qualification.qualificationName}"></td>
		            <td th:text="${data.appointmentDate}"></td>
		            <td th:text="${data.joiningType == 'F' ? 'Full Time' : 'Part Time'}"></td>
		            <td th:text="${data.tenurePeriodYr}"></td>
		            <td th:text="${data.phoneNo}"></td>
		            <td th:text="${data.emailId}"></td>
		            <td th:text="${data.fax}"></td>

		            <td>
						<div class="d-flex align-items-center gap-2">
						<button type="button" class="btn btn-primary btn-sm editBtn" th:data-id="${data.pprSlnaId}" data-bs-toggle="modal" data-bs-target="#editModal" th:if="${#strings.trim(data.status) == 'D'}">
						       <i class="fas fa-edit"></i>
						    </button>
							&nbsp;
		                <a th:if="${#strings.trim(data.status) == 'D'}" th:href="@{/deleteDetailsOfSLNA(id=${data.pprSlnaId})}"
		                   class="btn btn-danger btn-sm"
		                   onclick="return confirm('Are you sure you want to delete this record?');">
		                    <i class="fas fa-trash"></i>
		                </a>
						<a th:if="${#strings.trim(data.status) == 'D'}" th:href="@{/completeDetailsOfSLNA(id=${data.pprSlnaId})}"
							class="btn btn-success btn-sm" onclick="return confirm('Are you sure you want to Complete this record?');">
							<i class="fas fa-check"></i>
						</a>
						<span th:if="${#strings.trim(data.status) == 'C'}" class="badge bg-success">
							<i class="fas fa-check-circle"></i> Completed
						</span>
						</div>
		            </td>
		        </tr>
		        <tr th:if="${#lists.isEmpty(detailsOfSLNAList)}">
		            <td colspan="11" class="text-center text-danger">
		                No records found.
		            </td>
		        </tr>
		        </tbody>
		    </table>
		 </div>   

		<!-- Edit Popup -->
		<div class="modal fade" id="editModal">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<div class="modal-header bg-primary text-white">
						<h5>Edit Details</h5>
						<button class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<form id="editForm" th:action="@{/updateDetailsOfSLNA}" method="post">
						<input type="hidden" id="pprSlna" name="pprSlna">
						<!-- Member Details -->
						<div class="row mb-3 align-items-center">
							<label class="col-md-3 fw-bold"> Member Details <span class="required">*</span></label>
							<input type="hidden" name="stcode" th:value="${stcode}">
							<div class="col-md-9">
								<div class="form-check form-check-inline" th:each="member : ${memberDetailsList}">
									<input class="form-check-input" type="radio" name="memberType" th:id="'member'+${member.memberId}"
										th:value="${member.memberId}" />
									<label class="form-check-label" th:for="'member'+${member.memberId}" th:text="${member.memberType}">
									</label>
								</div>
							</div>
						</div>
						
						<div class="row mb-3 align-items-center">
							<label class="col-md-3 fw-bold">Name <span class="required">*</span></label>
							<div class="col-md-4">
								<input type="text" class="form-control" id="firstName" name="firstName">
								<div class="field-error" data-error-for="firstName"></div>
							</div>
							<div class="col-md-4">
								<input type="text" class="form-control" id="lastName" name="lastName">
								<div class="field-error" data-error-for="lastName"></div>
							</div>
						</div>
						
						<div class="row mb-3 align-items-center">
							<label class="col-md-3 fw-bold">Designation <span class="required">*</span></label>
							<div class="col-md-5">
								<select class="form-select" id="designation" name="designation">
									<option value="">--Select--</option>
									<option th:each="d : ${designationList}" th:value="${d.designationId}" th:text="${d.designationName}">
									</option>
								</select>
								<div class="field-error" data-error-for="designation"></div>
							</div>
						</div>
						
						<div class="row mb-3 align-items-center">
							<label class="col-md-3 fw-bold">Qualification <span class="required">*</span></label>
							<div class="col-md-5">
								<select class="form-select" id="qualification" name="qualification">
									<option value="">--Select--</option>
									<option th:each="q : ${qualificationList}" th:value="${q.qualificationId}" th:text="${q.qualificationName}">
									</option>
								</select>
								<div class="field-error" data-error-for="qualification"></div>
							</div>
						</div>
						
						<div class="row mb-3 align-items-center">
							<label class="col-md-3 fw-bold">Appointment Date <span class="required">*</span></label>
							<div class="col-md-4">
								<input type="date" id="appointmentDate" class="form-control" name="appointmentDate" min="2026-01-01"
									th:value="${appointmentDate}" required>
									<div class="field-error" data-error-for="appointmentDate"></div>
							</div>
						</div>
						
						<div class="row mb-3 align-items-center">
							<label class="col-md-3 fw-bold"> Nature of Appointment <span class="required">*</span></label>
							<div class="col-md-9">
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" name="joiningType" value="F" id="joiningFull">
									<label class="form-check-label"> Full Time </label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" name="joiningType" value="P" id="joiningPart">
									<label class="form-check-label"> Part Time </label>
								</div>
								<div class="field-error" data-error-for="joiningType"></div>
							</div>
						</div>
						
						<div class="row mb-3 align-items-center">
							<label class="col-md-3 fw-bold"> Tenure Period (in years) <span class="required">*</span></label>
							<div class="col-md-3">
								<input type="text" id="tenure" class="form-control" name="tenure">
								<div class="field-error" data-error-for="tenure"></div>
							</div>
						</div>
						
						<div class="row mb-3 align-items-center">
							<label class="col-md-3 fw-bold"> Phone No <span class="required">*</span></label>
							<div class="col-md-4">
								<input type="text" id="phoneNo" class="form-control" name="phone">
								<div class="field-error" data-error-for="phone"></div>
							</div>
						</div>
						
						<div class="row mb-3 align-items-center">
							<label class="col-md-3 fw-bold"> Email <span class="required">*</span></label>
							<div class="col-md-5">
								<input type="email" id="emailId" class="form-control" name="email">
								<div class="field-error" data-error-for="email"></div>
							</div>
						</div>
						
						<div class="row mb-4 align-items-center">
							<label class="col-md-3 fw-bold"> Fax </label>
							<div class="col-md-4">
								<input type="text" id="fax" class="form-control" name="fax">
							</div>
						</div>
						
						<div class="text-center mt-4">
							<button type="submit" name="updateAction" value="D" class="btn btn-warning">
								<i class="fas fa-save"></i>
								Update
							</button>
						</div>
					</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
