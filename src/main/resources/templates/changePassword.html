<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Change Password | WDC-PMKSY 3.0</title>

    <link rel="stylesheet" th:href="@{/css/changePassword.css}">

    <style>

        body{
            background:#f5f7fb;
        }

        .card{
            border-radius:15px;
        }

        .card-header{
            border-radius:15px 15px 0 0 !important;
        }

        .card-body{
            padding:35px;
        }

        .form-control{
            height:46px;
            border-radius:8px;
        }

        .form-label{
            font-weight:600;
            color:#444;
        }

        .btn{
            min-width:170px;
            border-radius:8px;
        }

        #passwordMatch{
            font-size:.92rem;
        }

        #length,
        #upper,
        #lower,
        #special{
            transition:.3s;
            font-size:14px;
        }

        .valid{
            color:#198754 !important;
            font-weight:600;
        }

        .invalid{
            color:#dc3545 !important;
            font-weight:600;
        }

        .alert{
            border-radius:10px;
        }

        @media(max-width:768px){

            .btn{
                width:100%;
                margin-bottom:10px;
            }

            .btn + .btn{
                margin-left:0 !important;
            }

        }

    </style>

    <script>

        document.addEventListener("DOMContentLoaded",function(){

            const password=document.getElementById("newPassword");
            const confirm=document.getElementById("confirmPassword");
            const submit=document.getElementById("submitBtn");
            const show=document.getElementById("showPassword");

            function updateRule(id,valid){

                const item=document.getElementById(id);
                const icon=item.querySelector("i");

                if(valid){

                    item.classList.remove("invalid");
                    item.classList.add("valid");

                    icon.className="fa-solid fa-circle-check me-2";

                }else{

                    item.classList.remove("valid");
                    item.classList.add("invalid");

                    icon.className="fa-solid fa-circle-xmark me-2";

                }

            }

            function validate(){

                const value=password.value;

                const length=value.length>=6;
                const upper=/[A-Z]/.test(value);
                const lower=/[a-z]/.test(value);
                const special=/[^A-Za-z0-9]/.test(value);

                updateRule("length",length);
                updateRule("upper",upper);
                updateRule("lower",lower);
                updateRule("special",special);

                let match=document.getElementById("passwordMatch");

                if(confirm.value.length>0){

                    if(value===confirm.value){

                        match.innerHTML='<i class="fa-solid fa-circle-check me-1"></i>Passwords match';
                        match.className="text-success fw-bold";

                    }else{

                        match.innerHTML='<i class="fa-solid fa-circle-xmark me-1"></i>Passwords do not match';
                        match.className="text-danger fw-bold";

                    }

                }else{

                    match.innerHTML="";

                }

                submit.disabled=!(length && upper && lower && special && value===confirm.value);

            }

            password.addEventListener("keyup",validate);
            confirm.addEventListener("keyup",validate);

            show.addEventListener("change",function(){

                const type=this.checked?"text":"password";

                password.type=type;
                confirm.type=type;

            });

        });

    </script>

</head>

<body>

<div layout:fragment="content">

    <div class="container mt-4">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow border-0">

                    <div class="card-header bg-primary text-white">

                        <h4 class="mb-0">
                            <i class="fa-solid fa-key me-2"></i>
                            Change Password
                        </h4>

                    </div>

                    <div class="card-body">

                        <!-- Success Message -->
                        <div th:if="${success}" class="alert alert-success">
                            <i class="fa-solid fa-circle-check me-2"></i>
                            <span th:text="${success}"></span>
                        </div>

                        <!-- Error Message -->
                        <div th:if="${error}" class="alert alert-danger">
                            <i class="fa-solid fa-circle-xmark me-2"></i>
                            <span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/changePassword}"
                              method="post"
                              id="passwordForm">

                            <!-- Username -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    User Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:value="${username}"
                                       readonly>

                            </div>

                            <!-- New Password -->

                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    New Password
                                </label>

                                <input type="password"
                                       id="newPassword"
                                       class="form-control"
                                       name="newPassword"
                                       placeholder="Enter New Password"
                                       autocomplete="new-password"
                                       required>

                            </div>

                            <!-- Confirm Password -->

                            <div class="mb-2">

                                <label class="form-label fw-bold">
                                    Confirm Password
                                </label>

                                <input type="password"
                                       id="confirmPassword"
                                       class="form-control"
                                       name="confirmPassword"
                                       placeholder="Confirm Password"
                                       autocomplete="new-password"
                                       required>

                            </div>

                            <!-- Show Password -->

                            <div class="form-check mt-3 mb-3">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="showPassword">

                                <label class="form-check-label"
                                       for="showPassword">

                                    Show Password

                                </label>

                            </div>

                            <!-- Password Match -->

                            <div id="passwordMatch"
                                 class="small fw-bold mb-3"></div>

                            <!-- Password Validation -->

                            <div class="border rounded p-3 bg-light mb-4">

                                <h6 class="mb-3 text-primary">

                                    <i class="fa-solid fa-shield-halved me-2"></i>

                                    Password Validation

                                </h6>

                                <div id="length" class="text-danger mb-2">
                                    <i class="fa-solid fa-circle-xmark me-2"></i>
                                    Minimum 6 characters
                                </div>

                                <div id="upper" class="text-danger mb-2">
                                    <i class="fa-solid fa-circle-xmark me-2"></i>
                                    At least one uppercase letter
                                </div>

                                <div id="lower" class="text-danger mb-2">
                                    <i class="fa-solid fa-circle-xmark me-2"></i>
                                    At least one lowercase letter
                                </div>

                                <div id="special" class="text-danger">
                                    <i class="fa-solid fa-circle-xmark me-2"></i>
                                    At least one special character
                                </div>

                            </div>

                            <!-- Buttons -->

                            <div class="text-center">

                                <button type="submit"
                                        class="btn btn-success px-4"
                                        id="submitBtn"
                                        disabled>

                                    <i class="fa-solid fa-floppy-disk me-2"></i>

                                    Update Password

                                </button>

                                <a th:href="@{/profile}"
                                   class="btn btn-secondary px-4 ms-2">

                                    <i class="fa-solid fa-arrow-left me-2"></i>

                                    Cancel

                                </a>

                            </div>

                            <!-- Password Guidelines -->

                            <!-- <div class="mt-5">

                                <div class="alert alert-info mb-0">

                                    <i class="fa-solid fa-circle-info me-2"></i>

                                    <strong>Password Guidelines:</strong>

                                    Password must contain at least one
                                    uppercase letter, one lowercase letter,
                                    one special character and be at least
                                    <strong>6 characters long</strong>.

                                </div>

                            </div> -->

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
