<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | WDC-PMKSY 3.0</title>
    <link rel="icon" href="/favicon.ico">
    
     <link rel="stylesheet" th:href="@{/css/success.css}">

</head>

<body>


<div layout:fragment="content">

    <div class="container-fluid">

        <div class="dashboard-card">

            <div class="card-header">

                <div>

                    <h3>
                        <i class="fa-solid fa-user-circle"></i>
                        User Profile
                    </h3>

                </div>

            </div>

            <!-- Region Details -->

            <div class="info-section">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h5 class="mb-0">
            <i class="fa-solid fa-location-dot"></i>
            Region Information
        </h5>

        <a th:href="@{/changePassword}" class="btn btn-success">
            <i class="fa-solid fa-key me-2"></i>
            Change Password
        </a>

    </div>

    <div class="row">

        <div class="col-lg-6">

            <label class="form-label">
                <th:block th:each="list : ${listm}">
                    State:
                    <span th:text="${list.value[0].statename}"></span>
                </th:block>
            </label>

        </div>

        <th:block th:if="${userType == 'DI' or userType == 'PI'}">

            <div class="col-lg-6">

                <label class="form-label">
                    <th:block th:each="list : ${listm}">
                        District:
                        <span th:text="${list.value[0].districtname}"></span>
                    </th:block>
                </label>

            </div>

        </th:block>

    </div>

</div>

            <!-- User Information -->

            <div class="info-section mt-4">

                <h5>

                    <i class="fa-solid fa-address-card"></i>

                    User Information

                </h5>

                <div class="table-responsive">

                    <table class="table table-bordered dashboard-table">

                        <tbody>

                        <tr th:each="user : ${userList}">

                            <th>User Name</th>

                            <td th:text="${user[0]}"></td>

                            <th>User Type</th>

                            <td th:text="${user[11]}"></td>

                        </tr>

                        <tr th:each="user : ${userList}">

                            <th>Email</th>

                            <td th:text="${user[5]}"></td>

                            <th>Mobile</th>

                            <td th:text="${user[6]}"></td>

                        </tr>

                        <tr th:each="user : ${userList}">

                            <th>Address</th>

                            <td colspan="3" th:text="${user[2]}"></td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>
        
        

    </div>


</div>



<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/success.js"></script>

</body>
</html>
