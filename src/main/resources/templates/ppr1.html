<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>Institutional Structure</title>

<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->
<style>
	.required{
	    color:red;
	}

	
</style>


<script>

// Restrict dates before 2026
document.addEventListener("DOMContentLoaded", function () {

    const notificationDate = document.getElementsByName("notificationDate")[0];
    const mouDate = document.getElementsByName("mouDate")[0];

    notificationDate.setAttribute("min", "2026-01-01");
    mouDate.setAttribute("min", "2026-01-01");

});

// Allow only PDF files
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("institutionForm");
	const notificationFile = document.getElementById("notificationFile");
	const mouFile = document.getElementById("mouFile");

	    function validatePDF(input) {
	        if (input.files.length === 0) return true;

	        const file = input.files[0];
	        const fileName = file.name.toLowerCase();

	        if (file.type !== "application/pdf" && !fileName.endsWith(".pdf")) {
	            alert("Only PDF files are allowed.");
	            input.value = "";
	            return false;
	        }

	        return true;
	    }

	    function validateSameFile(changedInput, otherInput) {

	        if (changedInput.files.length === 0 || otherInput.files.length === 0)
	            return;

	        const file1 = changedInput.files[0];
	        const file2 = otherInput.files[0];

	        if (
	            file1.name.toLowerCase() === file2.name.toLowerCase() &&
	            file1.size === file2.size
	        ) {
	            alert("Notification PDF and MoU PDF cannot be the same file.");
	            changedInput.value = "";
	        }
	    }

	    notificationFile.addEventListener("change", function () {
	        if (validatePDF(this)) {
	            validateSameFile(this, mouFile);
	        }
	    });

	    mouFile.addEventListener("change", function () {
	        if (validatePDF(this)) {
	            validateSameFile(this, notificationFile);
	        }
	    });
	
	
	
	
	

    form.addEventListener("submit", function (e) {

        const slnaType = document.getElementsByName("slnaType")[0];
        const notificationDate = document.getElementsByName("notificationDate")[0];
        const mouDate = document.getElementsByName("mouDate")[0];
        const notificationFile = document.getElementsByName("notificationFile")[0];
        const mouFile = document.getElementsByName("mouFile")[0];

        // Type of SLNA
        if (slnaType.value.trim() === "") {
            alert("Please enter Type of SLNA.");
            slnaType.focus();
            e.preventDefault();
            return false;
        }

        // Notification Date
        if (notificationDate.value === "") {
            alert("Please select Date of Notification.");
            notificationDate.focus();
            e.preventDefault();
            return false;
        }

        // Notification PDF
        if (notificationFile.files.length === 0) {
            alert("Please upload Notification PDF.");
            notificationFile.focus();
            e.preventDefault();
            return false;
        }

        // MoU Date
        if (mouDate.value === "") {
            alert("Please select Date of MoU.");
            mouDate.focus();
            e.preventDefault();
            return false;
        }

        // MoU PDF
        if (mouFile.files.length === 0) {
            alert("Please upload MoU PDF.");
            mouFile.focus();
            e.preventDefault();
            return false;
        }

        // Validate PDF type
        const file1 = notificationFile.files[0];
        const file2 = mouFile.files[0];

        if (!file1.name.toLowerCase().endsWith(".pdf")) {
            alert("Notification file must be a PDF.");
            notificationFile.value = "";
            notificationFile.focus();
            e.preventDefault();
            return false;
        }

        if (!file2.name.toLowerCase().endsWith(".pdf")) {
            alert("MoU file must be a PDF.");
            mouFile.value = "";
            mouFile.focus();
            e.preventDefault();
            return false;
        }

        // Same file validation
        if (file1.name.toLowerCase() === file2.name.toLowerCase()
                && file1.size === file2.size) {

            alert("Notification PDF and MoU PDF cannot be the same file.");

            mouFile.value = "";
            mouFile.focus();

            e.preventDefault();
            return false;
        }

    });

});

</script>

</head>

<body>





<div layout:fragment="content">


    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
               Institutional Structure
            </h4>
        </div>
		
		<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${success}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
		    <span th:text="${error}"></span>
		    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

        <div class="card-body">

             <form id="institutionForm" th:action="@{/saveInstitutionalStructurePPR1}" method="post" enctype="multipart/form-data" novalidate>

                <div class="row g-4">

                    <!-- State -->

                    <div class="col-md-6">

                        <label class="form-label">
                           <b> State Name </b><span class="required">*</span>
                        </label>

						<input type="text" class="form-control" name="stateName"  th:value="${statename}" readonly>
											
						<input type="hidden" name="stcode"  th:value="${stcode}" >

                    </div>

                    <!-- Type of SLNA -->

                    <div class="col-md-6">

                        <label class="form-label">
                           <b> Type of SLNA </b><span class="required">*</span>
                        </label>

						<input type="text" class="form-control"name="slnaType"
						        th:value="${slnaType}" placeholder="Enter Type of SLNA" required>

                    </div>

                    <!-- Date -->

                    <div class="col-md-6">

                        <label class="form-label">
                          <b>  Date of Notification </b><span class="required">*</span>
                        </label>

						<input type="date" class="form-control" name="notificationDate"
						            min="2026-01-01" th:value="${notificationDate}" required>

                    </div>

                    <!-- Upload -->

                    <div class="col-md-6">

                        <label class="form-label">
                           <b> Upload Notification </b> <span class="required">*</span>
                        </label>

						<input type="file"
						       id="notificationFile"
						       name="notificationFile"
						       class="form-control"
						       accept=".pdf,application/pdf"
						       required>
                  <small class="form-text text-muted">Only PDF file is allowed.</small>
                    </div>
                    
                    <div class="col-md-6">

                        <label class="form-label">
                          <b>  Date of MoU with DoLR </b> <span class="required">*</span>
                        </label>

						<input type="date" class="form-control" name="mouDate"
						          min="2026-01-01" th:value="${mouDate}" required>

                    </div>
                    <div class="col-md-6">

                        <label class="form-label">
                           <b> Upload MoU </b> <span class="required">*</span>
                        </label>

						<input type="file"
						       id="mouFile"
						       name="mouFile"
						       class="form-control"
						       accept=".pdf,application/pdf"
						       required>
											   
						<small class="form-text text-muted">Only PDF file is allowed.</small>
                    </div>

                </div>

                <hr>

                <div >
					<center>
					<button type="submit" name="action"  value="D" class="btn btn-warning">

                        <i class="fas fa-save"></i>

                        Save as Draft

                    </button>
					</center>

                </div>

            </form>

        </div>
		
						<div class="table-responsive" th:if="${#lists.size(ppr1List) > 0}">
		                    <table class="table table-bordered">
								<h4>
								      <b> <centre> List of  Institutional Structure </centre>  </b>
								 </h4>
								 <br/>
		                        <tbody>
		                        <tr>
		                            <th class="table-primary">State Name</th>
		                            <th class="table-primary">Type of SLNA</th>
									<th class="table-primary">Date of Notification</th>
									<th class="table-primary">Uploaded Notification</th>
									<th class="table-primary">Date of MoU with DoLR</th>
									<th class="table-primary">Upload MoU</th>
									<th class="table-primary">Action</th>
		                        </tr>
								</tbody>
		                       <!--  <tr th:each="user : ${ppr1List}">

		                           <td th:text="${user[2]}"></td>-->
									
								   <tr th:each="user, stat : ${ppr1List}">
								       <td th:text="${stat.first ? user[2] : ''}"></td>
									
									
		                            <td th:text="${user[3]}"></td>
									<td th:text="${user[4]}"></td>
									<td>
										<!--<a th:href="@{/viewPdf(path=${user[5]})}" target="_blank">
										        View Uploaded
										</a>-->
										
										<a th:href="@{/viewPdfInstitutionalStructure(id=${user[0]},type='notification')}" target="_blank">
										    View Uploaded
										</a>
										
									</td>

									<td th:text="${user[6]}"></td>

									<td>
										<a th:href="@{/viewPdfInstitutionalStructure(id=${user[0]},type='mou')}" target="_blank">
												View Uploaded
										</a>
									</td>
									
									<td>
										<a th:if="${user[8].toString().equals('D')}"
										   th:href="@{/deleteInstitutionalStructurePPR1(id=${user[0]})}"
										   class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this record?');">
										     <i class="fas fa-trash"></i>
										</a>
										&nbsp; &nbsp; 
										<a th:if="${user[8].toString().equals('D')}"
										   th:href="@{/editInstitutionalStructurePPR1(id=${user[0]})}"
										   class="btn btn-primary btn-sm"
										   onclick="return confirm('Are you sure you want to edit this record?');">
										     <i class="fas fa-edit"></i>
										</a>
										&nbsp; &nbsp; 
									    <a th:if="${user[8].toString().equals('D')}"
										th:href="@{/completeInstitutionalStructurePPR1(id=${user[0]})}"
									            class="btn btn-success btn-sm" onclick="return confirm('Are you sure you want to complete this record?');">
									         <i class="fas fa-check"></i>
									     </a>
									</td>
									
		                        </tr>

		                    </table>

		                </div>
		
		

    </div>

</div>

</body>
</html>
