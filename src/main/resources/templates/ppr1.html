<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>PPR1</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script>

// Restrict dates before 2025
document.addEventListener("DOMContentLoaded", function () {

    const notificationDate = document.getElementsByName("notificationDate")[0];
    const mouDate = document.getElementsByName("mouDate")[0];

    notificationDate.setAttribute("min", "2025-01-01");
    mouDate.setAttribute("min", "2025-01-01");

});

// Allow only PDF files
document.querySelectorAll('input[type="file"]').forEach(function(fileInput){

    fileInput.addEventListener("change", function(){

        const file=this.files[0];

        if(file){

            if(file.type!=="application/pdf"){

                alert("Only PDF files are allowed.");

                this.value="";

            }

        }

    });

});

</script>

</head>

<body>





<div layout:fragment="content">


    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
               Institutional Structure
            </h4>
        </div>

        <div class="card-body">

            <form th:action="@{/savePiaNotification}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="row g-4">

                    <!-- State -->

                    <div class="col-md-6">

                        <label class="form-label">
                            State Name
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                name="stateName"
                                th:value="${stateName}"
                                readonly>

                    </div>

                    <!-- Type of SLNA -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Type of SLNA
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                name="slnaType"
                                placeholder="Enter Type of SLNA">

                    </div>

                    <!-- Date -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Date of Notification
                        </label>

                        <input
                                type="date"
                                class="form-control"
                                name="notificationDate">

                    </div>

                    <!-- Upload -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Upload Notification
                        </label>

                        <input
                                type="file"
                                class="form-control"
                                name="notificationFile"
                                accept=".pdf">
                  <small class="form-text text-muted">Only PDF file is allowed.</small>
                    </div>
                    
                    <div class="col-md-6">

                        <label class="form-label">
                            Date of MoU with DoLR
                        </label>

                        <input
                                type="date"
                                class="form-control"
                                name="mouDate">

                    </div>
                    <div class="col-md-6">

                        <label class="form-label">
                            Upload MoU
                        </label>

                        <input
                                type="file"
                                class="form-control"
                                name="mouFile" accept=".pdf">
<small class="form-text text-muted">Only PDF file is allowed.</small>
                    </div>

                </div>

                <hr>

                <div class="d-flex justify-content-end gap-3">

                    <button
                            type="submit"
                            name="action"
                            value="draft"
                            class="btn btn-warning">

                        <i class="fas fa-save"></i>

                        Save Draft

                    </button>

                    <button
                            type="submit"
                            name="action"
                            value="submit"
                            class="btn btn-success">

                        <i class="fas fa-paper-plane"></i>

                        Submit

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
