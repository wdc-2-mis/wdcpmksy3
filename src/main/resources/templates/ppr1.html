<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>PPR1</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    font-family:Arial, Helvetica, sans-serif;
}

.page-title{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:#0d6efd;
    margin-bottom:25px;
}

.form-card{
    max-width:900px;
    margin:40px auto;
    background:#ffffff;
    border-radius:10px;
    padding:35px;
    box-shadow:0px 3px 12px rgba(0,0,0,0.15);
}

.form-label{
    font-weight:600;
    color:#333;
}

.required{
    color:red;
}

.form-control{
    height:45px;
}

input[type="file"]{
    height:auto;
    padding:8px;
}

.button-section{
    margin-top:35px;
    text-align:center;
}

.btn{
    min-width:140px;
    margin:0 10px;
}

.note{
    color:red;
    font-size:14px;
    margin-top:5px;
}

</style>

</head>

<body>

<div layout:fragment="content">	
	
	
<div class="container">

    <div class="form-card">

		<div class="card-header bg-primary text-white">
		            <h4 class="mb-0">
		                Institutional Structure
		            </h4>
		        </div>
       <!-- <div class="page-title">
            Institutional Structure
        </div>-->
		
		<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
		    <span th:text="${success}"></span>

		    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

        <form th:action="@{/saveInstitutionalStructure}" method="post" enctype="multipart/form-data">

            <div class="row mb-4">

                <label class="col-md-4 col-form-label form-label">
                    State Name <span class="required">*</span>
                </label>
                <div class="col-md-8">
                    <input type="text" class="form-control" name="stateName"
                        th:value="${statename}" readonly>
						
					<input type="hidden" name="stcode"  th:value="${stcode}" >
                </div>

            </div>

            <div class="row mb-4">

                <label class="col-md-4 col-form-label form-label">
                    Type of SLNA <span class="required">*</span>
                </label>

                <div class="col-md-8">
                    <input type="text" class="form-control"name="slnaType"
                        th:value="${slnaType}" placeholder="Enter Type of SLNA" required>
                </div>

            </div>

            <div class="row mb-4">

                <label class="col-md-4 col-form-label form-label">
                    Date of Notification <span class="required">*</span>
                </label>

                <div class="col-md-8">
					<input type="date" class="form-control" name="notificationDate"
                        min="2025-01-01" th:value="${notificationDate}" required>
                </div>

            </div>

            <div class="row mb-4">

                <label class="col-md-4 col-form-label form-label">
                    Upload Notification <span class="required">*</span>
                </label>

                <div class="col-md-8">
                    <input type="file" class="form-control" name="notificationFile"
                        accept="application/pdf" required>
                    <div class="note">
                        Only PDF file is allowed.
                    </div>
                </div>

            </div>

            <div class="row mb-4">

                <label class="col-md-4 col-form-label form-label">
                    Date of MoU with DoLR <span class="required">*</span>
                </label>

                <div class="col-md-8">

                    <input type="date" class="form-control" name="mouDate"
                        min="2025-01-01" th:value="${mouDate}" required>

                </div>

            </div>

            <div class="row mb-4">

                <label class="col-md-4 col-form-label form-label">
                    Upload MoU <span class="required">*</span>
                </label>

                <div class="col-md-8">
                    <input type="file" class="form-control"
                        name="mouFile" accept="application/pdf" required>
                    <div class="note">
                        Only PDF file is allowed.
                    </div>
                </div>

            </div>

            <!-- Buttons -->
            <div class="button-section">

                <button type="submit" name="action"
                    value="D" class="btn btn-secondary">Draft
                </button>

               <!-- <button type="submit" name="action"
                    value="C" class="btn btn-primary">Complete

                </button>-->

            </div>

        </form>

    </div>

</div>




<script>

// Restrict dates before 2025
document.addEventListener("DOMContentLoaded", function () {

    const notificationDate = document.getElementsByName("notificationDate")[0];
    const mouDate = document.getElementsByName("mouDate")[0];

    notificationDate.setAttribute("min", "2025-01-01");
    mouDate.setAttribute("min", "2025-01-01");

});

// Allow only PDF files
document.querySelectorAll('input[type="file"]').forEach(function(fileInput){

    fileInput.addEventListener("change", function(){

        const file=this.files[0];

        if(file){

            if(file.type!=="application/pdf"){

                alert("Only PDF files are allowed.");

                this.value="";

            }

        }

    });

});

</script>

</div>

</body>
</html>
