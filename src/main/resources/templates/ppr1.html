<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>PPR1</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
	.required{
	    color:red;
	}

	
</style>


<script>

// Restrict dates before 2025
document.addEventListener("DOMContentLoaded", function () {

    const notificationDate = document.getElementsByName("notificationDate")[0];
    const mouDate = document.getElementsByName("mouDate")[0];

    notificationDate.setAttribute("min", "2025-01-01");
    mouDate.setAttribute("min", "2025-01-01");

});

// Allow only PDF files
document.addEventListener("DOMContentLoaded", function () {

    document.querySelectorAll('input[type="file"]').forEach(function(input){

        input.addEventListener("change", function(){

            if(this.files.length === 0) return;

            const file = this.files[0];

            const fileName = file.name.toLowerCase();

            if(file.type !== "application/pdf" && !fileName.endsWith(".pdf")){

                alert("Please upload only PDF file.");

                this.value = "";
            }

        });

    });

});

</script>

</head>

<body>





<div layout:fragment="content">


    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
               Institutional Structure
            </h4>
        </div>
		
		<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
				    <span th:text="${success}"></span>

				    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>

        <div class="card-body">

             <form th:action="@{/saveInstitutionalStructurePPR1}" method="post" enctype="multipart/form-data">

                <div class="row g-4">

                    <!-- State -->

                    <div class="col-md-6">

                        <label class="form-label">
                           <b> State Name </b><span class="required">*</span>
                        </label>

						<input type="text" class="form-control" name="stateName"  th:value="${statename}" readonly>
											
						<input type="hidden" name="stcode"  th:value="${stcode}" >

                    </div>

                    <!-- Type of SLNA -->

                    <div class="col-md-6">

                        <label class="form-label">
                           <b> Type of SLNA </b><span class="required">*</span>
                        </label>

						<input type="text" class="form-control"name="slnaType"
						        th:value="${slnaType}" placeholder="Enter Type of SLNA" required>

                    </div>

                    <!-- Date -->

                    <div class="col-md-6">

                        <label class="form-label">
                          <b>  Date of Notification </b><span class="required">*</span>
                        </label>

						<input type="date" class="form-control" name="notificationDate"
						            min="2025-01-01" th:value="${notificationDate}" required>

                    </div>

                    <!-- Upload -->

                    <div class="col-md-6">

                        <label class="form-label">
                           <b> Upload Notification </b> <span class="required">*</span>
                        </label>

						<input type="file" class="form-control" name="notificationFile"
						                       accept="application/pdf" required>
                  <small class="form-text text-muted">Only PDF file is allowed.</small>
                    </div>
                    
                    <div class="col-md-6">

                        <label class="form-label">
                          <b>  Date of MoU with DoLR </b> <span class="required">*</span>
                        </label>

						<input type="date" class="form-control" name="mouDate"
						          min="2025-01-01" th:value="${mouDate}" required>

                    </div>
                    <div class="col-md-6">

                        <label class="form-label">
                           <b> Upload MoU </b> <span class="required">*</span>
                        </label>

						<input type="file" class="form-control"
						         name="mouFile" accept="application/pdf" required>
											   
						<small class="form-text text-muted">Only PDF file is allowed.</small>
                    </div>

                </div>

                <hr>

                <div class="d-flex justify-content-end gap-3">
					
					<button type="submit" name="action"  value="D" class="btn btn-warning">

                        <i class="fas fa-save"></i>

                        Save Draft

                    </button>

                  <!--  <button
                            type="submit"
                            name="action"
                            value="C"
                            class="btn btn-success">

                        <i class="fas fa-paper-plane"></i>

                        Complete

                    </button>-->

                </div>

            </form>

        </div>
		
						<div class="table-responsive">
		                    <table class="table table-bordered">
								<h4>
								      <b> <centre> List of  Institutional Structure </centre>  </b>
								 </h4>
								 <br/>
		                        <tbody>
		                        <tr>
		                            <th class="table-primary">State Name</th>
		                            <th class="table-primary">Type of SLNA</th>
									<th class="table-primary">Date of Notification</th>
									<th class="table-primary">Uploaded Notification</th>
									<th class="table-primary">Date of MoU with DoLR</th>
									<th class="table-primary">Upload MoU</th>
									<th class="table-primary">Action</th>
		                        </tr>
								</tbody>
		                       <!--  <tr th:each="user : ${ppr1List}">

		                           <td th:text="${user[2]}"></td>-->
									
								   <tr th:each="user, stat : ${ppr1List}">
								       <td th:text="${stat.first ? user[2] : ''}"></td>
									
									
		                            <td th:text="${user[3]}"></td>
									<td th:text="${user[4]}"></td>
									<td>
										<!--<a th:href="@{/viewPdf(path=${user[5]})}" target="_blank">
										        View Uploaded
										</a>-->
										
										<a th:href="@{/viewPdf(id=${user[0]},type='notification')}" target="_blank">
										    View Uploaded
										</a>
										
									</td>

									<td th:text="${user[6]}"></td>

									<td>
										<a th:href="@{/viewPdf(id=${user[0]},type='mou')}" target="_blank">
												View Uploaded
										</a>
									</td>
									
									<td>
										<a th:if="${user[8] == 'D'}"
										   th:href="@{/deletePPR1(id=${user[0]})}"
										   class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this record?');">
										    Delete
										</a>
										&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; &nbsp;
									    <a th:if="${user[8] == 'D'}"
										th:href="@{/completePPR1(id=${user[0]})}"
									            class="btn btn-success btn-sm" onclick="return confirm('Are you sure you want to complete this record?');">
									        Complete
									     </a>
									</td>
									
		                        </tr>

		                    </table>

		                </div>
		
		

    </div>

</div>

</body>
</html>
