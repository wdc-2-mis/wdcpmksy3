<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>

	<meta charset="UTF-8">

	<title>Preliminary Project Report (PPR8)</title>

	<style>
		.required {
			color: red;
		}

		.table th {
			text-align: center;
			vertical-align: middle;
		}

		.table td {
			vertical-align: middle;
		}

		.form-label {
			font-weight: 600;
		}
	</style>


	<script>

		document.addEventListener("DOMContentLoaded", function () {

				var editModal = document.getElementById('editModal');
				editModal.addEventListener('show.bs.modal', function (event) {
					var button = event.relatedTarget;

					// Get data attributes  
					var Id = button.getAttribute('data-id');
					var state = button.getAttribute('data-state');
					var district = button.getAttribute('data-district');
					var project = button.getAttribute('data-project');
					var block = button.getAttribute('data-block');
					var scheme = button.getAttribute('data-scheme');
					var projSanctionedNo = button.getAttribute('data-projSanctionedNo');
					var projSanctionedArea = button.getAttribute('data-projSanctionedArea');
					var netArea = button.getAttribute('data-netArea');
					var proposedArea = button.getAttribute('data-proposedArea');
					var proposedAreaOthers = button.getAttribute('data-proposedAreaOthers');
					var netBalArea = button.getAttribute('data-netBalArea');
					
					// Populate modal fields  pprUnspentBalanceId
					document.getElementById('pprProposedAreaId').value = Id;
					document.getElementById('stateName1').value = state;
					document.getElementById('district1').value = district;
					document.getElementById('project1').value = project;
					document.getElementById("block1").value = block;
					document.getElementById("projSanctionedNo1").value = projSanctionedNo;
					document.getElementById("projSanctionedArea1").value = projSanctionedArea;
					document.getElementById("netArea1").value = netArea;
					document.getElementById("proposedArea1").value = proposedArea;
					document.getElementById("proposedAreaOthers1").value = proposedAreaOthers;
					document.getElementById("netBalArea1").value = netBalArea;
				});
					

			document.getElementById("district").addEventListener("change", function () {

				let districtId = this.value;
				let project = document.getElementById("project");

				// Clear existing options
				project.innerHTML = '<option value="">--Select Project--</option>';

				if (districtId === "") {
					return;
				}

				fetch('/getProjectsByDistrictPPR10?dcode=' + districtId)
					.then(response => response.json())
					.then(data => {

						data.forEach(function (item) {

							let option = document.createElement("option");
							option.value = item.id;          // PPR ID
							option.textContent = item.name;  // Project Name

							project.appendChild(option);
						});

					})
					.catch(error => {
						console.error("Error:", error);
					});

			});

			document.getElementById("project").addEventListener("change", function () {

				let projectId = this.value;
				let village = document.getElementById("block");

				village.innerHTML =
					'<option value="">--Select Block--</option>';

				if (projectId === "") {
					return;
				}

				fetch("/getBlockByProjectPPR8?pprId=" + projectId)
					.then(res => res.json())
					.then(data => {

						data.forEach(function (item) {

							let option = document.createElement("option");

							option.value = item.id;
							option.text = item.name;

							village.appendChild(option);

						});

					})
					.catch(err => console.log(err));

			});

		});



		document.addEventListener("DOMContentLoaded", function () {

			const form = document.getElementById("ppr8Form");

			form.addEventListener("submit", function (e) {

				const district = document.getElementById("district");
				const project = document.getElementById("project");
				const block = document.getElementById("block");

				const scheme = document.querySelector('input[name="scheme"]:checked');

				const projSanctionedNo = document.getElementsByName("projSanctionedNo")[0];
				const sanctionArea = document.getElementsByName("projSanctionedArea")[0];
				const netArea = document.getElementsByName("netArea")[0];
				const proposedArea = document.getElementsByName("proposedArea")[0];
				const otherArea = document.getElementsByName("proposedAreaOthers")[0];
				const balanceArea = document.getElementsByName("netBalArea")[0];

				if (district.value === "") {
					alert("Please select District.");
					district.focus();
					e.preventDefault();
					return false;
				}

				if (project.value === "") {
					alert("Please select Project.");
					project.focus();
					e.preventDefault();
					return false;
				}

				if (block.value === "") {
					alert("Please select Block.");
					block.focus();
					e.preventDefault();
					return false;
				}

				if (!scheme) {
					alert("Please select Scheme.");
					e.preventDefault();
					return false;
				}

				if (projSanctionedNo.value.trim() === "") {
					alert("Please enter No. of Pre WDC Projects.");
					projSanctionedNo.focus();
					e.preventDefault();
					return false;
				}

				if (sanctionArea.value.trim() === "") {
					alert("Please enter Sanctioned Area.");
					sanctionArea.focus();
					e.preventDefault();
					return false;
				}

				if (netArea.value.trim() === "") {
					alert("Please enter Net Area.");
					netArea.focus();
					e.preventDefault();
					return false;
				}

				if (proposedArea.value.trim() === "") {
					alert("Please enter Proposed Area.");
					proposedArea.focus();
					e.preventDefault();
					return false;
				}

				if (otherArea.value.trim() === "") {
					alert("Please enter Other DoLR Area.");
					otherArea.focus();
					e.preventDefault();
					return false;
				}

				if (balanceArea.value.trim() === "") {
					alert("Please enter Net Balance Area.");
					balanceArea.focus();
					e.preventDefault();
					return false;
				}

			});


		});



		/* ==========================================================
		   Load Block according to District
		========================================================== */
		document.addEventListener("DOMContentLoaded", function () {
			document.getElementById("district").addEventListener("change", function () {

				let dcode = this.value;

				if (dcode == "") {

					document.getElementById("block").innerHTML =
						"<option value=''>--Select Block--</option>";

					return;

				}

				fetch("/getBlocksByDistrict?dcode=" + dcode)

					.then(response => response.json())

					.then(data => {

						let block = document.getElementById("block");

						block.innerHTML =
							"<option value=''>--Select Block--</option>";

						data.forEach(function (item) {

							let option =
								document.createElement("option");

							option.value = item.bcode;

							option.text = item.blockName;

							block.appendChild(option);

						});

					})

					.catch(function (error) {

						console.log(error);

					});

			});


			/* ==========================================================
			   Auto Calculate Balance Area
			========================================================== */

			function calculateBalanceArea() {

				let sanctionArea = parseFloat(document.getElementById("sanctionArea").value) || 0;

				let netArea = parseFloat(document.getElementById("netArea").value) || 0;

				let proposedArea = parseFloat(document.getElementById("proposedArea").value) || 0;

				let otherArea = parseFloat(document.getElementById("otherArea").value) || 0;

				let balance = sanctionArea - (netArea + proposedArea + otherArea);


				if (balance < 0) {
					balance = 0;
				}

				document.getElementById("balanceArea").value = balance.toFixed(2);
			}

			document.getElementById("netArea").addEventListener("keyup", calculateBalanceArea);

			document.getElementById("proposedArea").addEventListener("keyup", calculateBalanceArea);

			document.getElementById("otherArea").addEventListener("keyup", calculateBalanceArea);



		});
		
		function validateInteger(input, maxLength) {
		    input.value = input.value.replace(/[^0-9]/g, '');
		    if (input.value.length > maxLength) {
		        input.value = input.value.slice(0, maxLength);
		    }
		}

		function validateDecimal(input) {
		    input.value = input.value.replace(/[^0-9.]/g, '');

		    const parts = input.value.split('.');
		    if (parts.length > 2) {
		        input.value = parts[0] + '.' + parts.slice(1).join('');
		    }
		}


	</script>

</head>

<body>

	<div layout:fragment="content">

		<div class="container-fluid px-4">

			<div class="card shadow-sm border-0 mt-3">

				<div class="card-header bg-primary text-white">
				            <h4 class="mb-0">Preliminary Project Report (PPR8)</h4>
				        </div>

			</div>

			<!-- SUCCESS -->

			<div th:if="${success}" class="alert alert-success alert-dismissible fade show">

				<span th:text="${success}"></span>

				<button type="button" class="btn-close" data-bs-dismiss="alert">

				</button>

			</div>

			<!-- ERROR -->

			<div th:if="${error}" class="alert alert-danger alert-dismissible fade show">

				<span th:text="${error}"></span>

				<button type="button" class="btn-close" data-bs-dismiss="alert">

				</button>

			</div>

			<div class="card-body px-4 py-4">

			    <h5 class="text-center fw-bold mb-4">
			        Details of Previously identified DPAP/DDP/IWDP areas proposed users
			    </h5>

			    <form id="ppr8Form" th:action="@{/saveDraftPPR8}" method="post" novalidate>

			        <!-- Row 1 -->
			        <div class="row mb-3 align-items-center">

			            <div class="col-md-2">
			                <label class="form-label fw-semibold">
			                    State Name <span class="text-danger">*</span>
			                </label>
			            </div>

			            <div class="col-md-4">
			                <input type="text" class="form-control"
			                       th:value="${stateName}" readonly>
			            </div>

			            <div class="col-md-2">
			                <label class="form-label fw-semibold">
			                    District Name <span class="text-danger">*</span>
			                </label>
			            </div>

			            <div class="col-md-4">
			                <select class="form-select" id="district" name="dcode">
			                    <option value="">--Select District--</option>
			                    <option th:each="d : ${distList}"
			                            th:value="${d.dcode}"
			                            th:text="${d.distName}"></option>
			                </select>
			            </div>

			        </div>

			        <!-- Row 2 -->
			        <div class="row mb-3 align-items-center">

			            <div class="col-md-2">
			                <label class="form-label fw-semibold">
			                    Name of Project <span class="text-danger">*</span>
			                </label>
			            </div>

			            <div class="col-md-4">
			                <select class="form-select" id="project" name="pprId">
			                    <option value="">--Select Project--</option>
			                </select>
			            </div>

			            <div class="col-md-2">
			                <label class="form-label fw-semibold">
			                    Name of Block <span class="text-danger">*</span>
			                </label>
			            </div>

			            <div class="col-md-4">
			                <select class="form-select" id="block" name="bcode">
			                    <option value="">--Select Block--</option>
			                    <option th:each="b : ${blockList}"
			                            th:value="${b.bcode}"
			                            th:text="${b.blockName}"></option>
			                </select>
			            </div>

			        </div>

			        <!-- Row 3 -->
			        <div class="row mb-3 align-items-center">

			            <div class="col-md-2">
			                <label class="form-label fw-semibold">
			                    Type of Scheme <span class="text-danger">*</span>
			                </label>
			            </div>

			            <div class="col-md-10">

			                <div class="form-check form-check-inline">
			                    <input class="form-check-input" type="radio"
			                           name="scheme" value="DPAP">
			                    <label class="form-check-label">DPAP</label>
			                </div>

			                <div class="form-check form-check-inline">
			                    <input class="form-check-input" type="radio"
			                           name="scheme" value="DDP">
			                    <label class="form-check-label">DDP</label>
			                </div>

			                <div class="form-check form-check-inline">
			                    <input class="form-check-input" type="radio"
			                           name="scheme" value="IWDP">
			                    <label class="form-check-label">IWDP</label>
			                </div>

			            </div>

			        </div>
					
					<!-- No. of Pre WDC 3.0 Projects sanctioned in the Block -->
					<div class="row mb-3 align-items-center">

					    <div class="col-md-4">
					        <label class="form-label fw-semibold">
					            No. of Pre WDC 3.0 Projects sanctioned in the Block
					            <span class="text-danger">*</span>
					        </label>
					    </div>

					    <div class="col-md-4">
					        <input type="text"
					               class="form-control form-control-sm"
					               name="projSanctionedNo"
					               maxlength="10"
					               oninput="validateInteger(this,11,5)"
					               required>
					    </div>

					</div>

					<!-- Area of Sanctioned Projects (ha) -->
					<div class="row mb-3 align-items-center">

					    <div class="col-md-4">
					        <label class="form-label fw-semibold">
					            Area of Sanctioned Projects (ha)
					            <span class="text-danger">*</span>
					        </label>
					    </div>

					    <div class="col-md-4">
					        <input type="text"
					               class="form-control form-control-sm"
					               name="projSanctionedArea"
					               maxlength="10"
					               oninput="validateDecimal(this,11,5)"
					               required>
					    </div>

					</div>

					<!-- Net Area to be Covered -->
					<div class="row mb-3 align-items-center">

					    <div class="col-md-4">
					        <label class="form-label fw-semibold">
					            Net Area to be Covered
					            <span class="text-danger">*</span>
					        </label>
					    </div>

					    <div class="col-md-4">
					        <input type="text"
					               class="form-control form-control-sm"
					               name="netArea"
					               maxlength="10"
					               oninput="validateDecimal(this, 11,5)"
					               required>
					    </div>

					</div>

					<!-- Area of Proposed Projects (ha) -->
					<div class="row mb-3 align-items-center">

					    <div class="col-md-4">
					        <label class="form-label fw-semibold">
					            Area of Proposed Projects (ha)
					            <span class="text-danger">*</span>
					        </label>
					    </div>

					    <div class="col-md-4">
					        <input type="text"
					               class="form-control form-control-sm"
					               name="proposedArea"
					               maxlength="10"
					               oninput="validateDecimal(this, 11,5)"
					               required>
					    </div>

					</div>

					<!-- Area proposed to be covered by scheme other than DoLR (ha) -->
					<div class="row mb-3 align-items-center">

					    <div class="col-md-4">
					        <label class="form-label fw-semibold">
					            Area proposed to be covered by scheme other than DoLR (ha)
					            <span class="text-danger">*</span>
					        </label>
					    </div>

					    <div class="col-md-4">
					        <input type="text"
					               class="form-control form-control-sm"
					               name="proposedAreaOthers"
					               maxlength="10"
					               oninput="validateDecimal(this, 11,5)"
					               required>
					    </div>

					</div>

					<!-- Net Balance Area (ha) -->
					<div class="row mb-3 align-items-center">

					    <div class="col-md-4">
					        <label class="form-label fw-semibold">
					            Net Balance Area (ha)
					        </label>
					    </div>

					    <div class="col-md-4">
					        <input type="text"
					               class="form-control form-control-sm"
					               name="netBalArea"
					               maxlength="10"
					               oninput="validateDecimal(this, 11,5)">
					    </div>

					</div>

			        <input type="hidden" name="action" value="D">

			        <div class="text-center">
			            <button type="submit" class="btn btn-warning px-4 fw-semibold">
			                <i class="fa fa-save me-1"></i> Save as Draft
			            </button>
			        </div>

			    </form>
		

					<!-- ===================================================== -->
					<!--                  DRAFT DETAILS                        -->
					<!-- ===================================================== -->

					<div class="table-responsive mt-5">

						<h4 class="text-center mb-3">

							<b>Draft Details</b>

						</h4>

						<table class="table table-bordered table-striped table-hover">

							<thead>

								<tr>

									<th class="table-primary">State</th>

									<th class="table-primary">District</th>

									<th class="table-primary">Project</th>

									<th class="table-primary">Block</th>

									<th class="table-primary">Scheme</th>

									<th class="table-primary">
										No. of Pre WDC Projects
									</th>

									<th class="table-primary">
										Sanctioned Area
									</th>

									<th class="table-primary">
										Net Area
									</th>

									<th class="table-primary">
										Proposed Area
									</th>

									<th class="table-primary">
										Other DoLR Area
									</th>

									<th class="table-primary">
										Balance Area
									</th>

									<th class="table-primary" style="min-width:120px;">
										Action
									</th>

								</tr>

							</thead>
							<tbody>


								<tr th:each="area : ${draftList}">

									<td th:text="${area.ppr.district.state.stName}"></td>

									<td th:text="${area.ppr.district.distName}"></td>

									<td th:text="${area.ppr.projectName}"></td>

									<td th:text="${area.block.blockName}"></td>

									<td th:text="${area.scheme.schemeName}"></td>

									<td th:text="${area.projSanctionedNo}"></td>

									<td th:text="${area.projSanctionedArea}"></td>

									<td th:text="${area.netArea}"></td>

									<td th:text="${area.proposedArea}"></td>

									<td th:text="${area.proposedAreaOthers}"></td>

									<td th:text="${area.netBalArea}"></td>

									<td th:if="${area.status.toString().equals('D')}">
										
										
										<a th:href="@{/deleteDraftPPR8(id=${area.pprProposedAreaId})}"
											class="btn btn-danger btn-sm"
											onclick="return confirm('Are you sure you want to delete this record?');">
											<i class="fas fa-trash"></i>
										</a>
										
										<button type="button" title="Edit" class="btn btn-primary btn-sm editBtn"
											th:attr="data-id=${area.pprProposedAreaId}, data-state=${area.ppr.district.state.stName}, data-district=${area.ppr.district.distName}, 
													data-project=${area.ppr.projectName}, data-block=${area.block.blockName}, data-scheme=${area.scheme.schemeName}, data-projSanctionedNo=${area.projSanctionedNo}, data-projSanctionedArea=${area.projSanctionedArea}, 
													data-netArea=${area.netArea}, data-proposedArea=${area.proposedArea}, data-proposedAreaOthers=${area.proposedAreaOthers}, data-netBalArea=${area.netBalArea}"
											data-bs-toggle="modal" data-bs-target="#editModal">
											<i class="fas fa-edit"></i>
										</button>

										<a th:href="@{/completeDraftPPR8(id=${area.pprProposedAreaId})}"
											class="btn btn-success btn-sm"
											onclick="return confirm('Are you sure you want to complete this record?');">
											<i class="fas fa-check"></i>
										</a>
									</td>
									<td th:if="${area.status.toString().equals('C')}">
										<span class="badge bg-success">
											<i class="fas fa-check-circle"></i> Completed
										</span>
									</td>

								</tr>

							</tbody>

						</table>

						<!-- ===================== Edit Modal ====================== -->

						<div class="modal fade" id="editModal">
							<div class="modal-dialog modal-xl">
								<div class="modal-content">

									<div class="modal-header bg-primary text-white">
										<h5>Edit PPR8 Details</h5>

										<button class="btn-close" data-bs-dismiss="modal"></button>
									</div>

									<div class="modal-body">
									
										<form id="editForm" th:action="@{/updateDraftPPR8}" method="post">
									
											<!-- Hidden ID -->
											<input type="hidden" id="pprProposedAreaId" name="pprProposedAreaId">
									
											<!-- ========================= ROW 1 ========================= -->
									
											<div class="row mb-3 align-items-center">
									
												<div class="col-md-2">
													<label class="form-label fw-semibold">
														State Name <span class="text-danger">*</span>
													</label>
												</div>
									
												<div class="col-md-4">
													<input type="text" name="stateName1" id="stateName1" class="form-control" readonly>
												</div>
									
												<div class="col-md-2">
													<label class="form-label fw-semibold">
														District Name <span class="text-danger">*</span>
													</label>
												</div>
									
												<div class="col-md-4">
													<input type="text" name="district1" id="district1" class="form-control" readonly>
												</div>
									
											</div>
									
											<!-- Row 2 -->
											<div class="row mb-3 align-items-center">
									
												<div class="col-md-2">
													<label class="form-label fw-semibold">
														Name of Project <span class="text-danger">*</span>
													</label>
												</div>
									
												<div class="col-md-4">
													<input type="text" name="project1" id="project1" class="form-control" readonly>
												</div>
									
												<div class="col-md-2">
													<label class="form-label fw-semibold">
														Name of Block <span class="text-danger">*</span>
													</label>
												</div>
									
												<div class="col-md-4">
													<input type="text" name="block1" id="block1" class="form-control" readonly>
												</div>
									
											</div>
									
											<!-- Row 3 -->
											<div class="row mb-3 align-items-center">
									
												<div class="col-md-2">
													<label class="form-label fw-semibold">
														Type of Scheme <span class="text-danger">*</span>
													</label>
												</div>
									
												<div class="col-md-10">
									
													<div class="form-check form-check-inline">
														<input class="form-check-input" type="radio" name="scheme" value="DPAP">
														<label class="form-check-label">DPAP</label>
													</div>
									
													<div class="form-check form-check-inline">
														<input class="form-check-input" type="radio" name="scheme" value="DDP">
														<label class="form-check-label">DDP</label>
													</div>
									
													<div class="form-check form-check-inline">
														<input class="form-check-input" type="radio" name="scheme" value="IWDP">
														<label class="form-check-label">IWDP</label>
													</div>
									
												</div>
									
											</div>
									
											<!-- No. of Pre WDC 3.0 Projects sanctioned in the Block -->
											<div class="row mb-3 align-items-center">
									
												<div class="col-md-4">
													<label class="form-label fw-semibold">
														No. of Pre WDC 3.0 Projects sanctioned in the Block
														<span class="text-danger">*</span>
													</label>
												</div>
									
												<div class="col-md-4">
													<input type="text" class="form-control form-control-sm" id="projSanctionedNo1" name="projSanctionedNo1" maxlength="10"
														oninput="validateInteger(this,11,5)" required>
												</div>
									
											</div>
									
											<!-- Area of Sanctioned Projects (ha) -->
											<div class="row mb-3 align-items-center">
									
												<div class="col-md-4">
													<label class="form-label fw-semibold">
														Area of Sanctioned Projects (ha)
														<span class="text-danger">*</span>
