<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>add DPR NRM Target </title>

<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->
<style>
	.required{
	    color:red;
	}

	body{
	    background:#f8f9fa;
	}

	.card{
	    border-radius:0;
	}

	.table th,.table td{
	    vertical-align:middle;
	    text-align:center;
	}

	.form-control,
	.form-select{
	    border-radius:0;
	}

	.heading{
	    font-size:22px;
	    font-weight:bold;
	    text-align:center;
	    margin-bottom:25px;
	}

	label{
	    font-weight:600;
	}	
</style>


<script>
	
		
	document.addEventListener("DOMContentLoaded", function () {

		const form1 = document.getElementById("DPRNRMTarget");
		       
				   if (!form1) {
				       return;
				   }

				   form1.addEventListener("submit", function (e) {

				       let isValid = true;

				       // ==========================================
				       // District
				       // ==========================================

				       const district = document.getElementById("district");

				       if (district.value === "") {

				           district.classList.add("is-invalid");
				           district.classList.remove("is-valid");

				           isValid = false;

				       } else {

				           district.classList.remove("is-invalid");
				           district.classList.add("is-valid");
				       }
					   
				       // ==========================================
				       // Project
				       // ==========================================

				       const project = document.getElementById("project");

				       if (project.value === "") {

				           project.classList.add("is-invalid");
				           project.classList.remove("is-valid");

				           isValid = false;

				       } else {

				           project.classList.remove("is-invalid");
				           project.classList.add("is-valid");
				       }


				       // ==========================================
				       // village
				       // ==========================================

				       const head = document.getElementById("head");

				       if (head.value === "") {

				           head.classList.add("is-invalid");
				           head.classList.remove("is-valid");

				           isValid = false;

				       } else {

				           head.classList.remove("is-invalid");
				           head.classList.add("is-valid");
				       }
					  
						const activity = document.getElementById("activity");

					   if (activity.value === "") {

						   activity.classList.add("is-invalid");
						   activity.classList.remove("is-valid");

						   isValid = false;

					   } else {

						   activity.classList.remove("is-invalid");
						   activity.classList.add("is-valid");
					   }			
									
					  
				       // ==========================================
				       // Helper function for text fields
				       // ==========================================

				       function validateTextField(element) {

				           if (element.value.trim() === "") {

				               element.classList.add("is-invalid");
				               element.classList.remove("is-valid");

				               isValid = false;

				           } else {

				               element.classList.remove("is-invalid");
				               element.classList.add("is-valid");
				           }
				       }


				       // ==========================================
				       // Numeric / Area fields
				       // ==========================================
					  
				       validateTextField(
				           document.getElementById("target")
				       );

				       

				       // ==========================================
				       // Stop form submission if invalid
				       // ==========================================

				       if (!isValid) {

				           e.preventDefault();
				           e.stopPropagation();

				           // Scroll to first invalid field
				           const firstInvalid =
				               form1.querySelector(".is-invalid");

				           if (firstInvalid) {

				               firstInvalid.scrollIntoView({
				                   behavior: "smooth",
				                   block: "center"
				               });

				               firstInvalid.focus();
				           }

				           return false;
				       }

				   });
				   
				   const fields = form1.querySelectorAll(
				          "input, select"
				   );
				   
				   fields.forEach(function (field) {

					field.addEventListener("change", function () {

						if (field.value.trim() !== "") {

							field.classList.remove("is-invalid");
							field.classList.add("is-valid");

						}

					});

					field.addEventListener("input", function () {

						if (field.value.trim() !== "") {

							field.classList.remove("is-invalid");
							field.classList.add("is-valid");

						}

					});

				});
		
		document.getElementById("district").addEventListener("change", function () {

		    let districtId = this.value;
		    let project = document.getElementById("project");
			
		    // Clear existing options
		    project.innerHTML = '<option value="">--Select Project--</option>';
		    if (districtId === "") {
		        return;
		    }
		    fetch('/getProjectsByDistrictDPRNRM?dcode=' + districtId)
		        .then(response => response.json())
		        .then(data => {
		            data.forEach(function(item) {
		                let option = document.createElement("option");
		                option.value = item.id;          // PPR ID
		                option.textContent = item.name;  // Project Name
		                project.appendChild(option);
		            });

		        })
		        .catch(error => {
		            console.error("Error:", error);
		        });
				
			

		});
		
		document.getElementById("head").addEventListener("change", function () {

		    let headId = this.value;
		    let activity = document.getElementById("activity");
		    activity.innerHTML ='<option value="">--Select Activity--</option>';
		    if(headId===""){
		        return;
		    }
		    fetch("/getActivitiesByHeadCodeDPRNRM?headId="+headId)
		        .then(res=>res.json())
		        .then(data=>{
		            data.forEach(function(item){
		                let option=document.createElement("option");
		                option.value=item.id;
		                option.text=item.name;
		                activity.appendChild(option);
		            });

		        }).catch(err=>console.log(err));
				
		});
		
		document.getElementById("activity").addEventListener("change", function () {

			let actId = this.value;
			const unitSpan = document.getElementById("unitDesc");
			document.getElementById("target").value="";
			if (actId === "") {
				return;
			}
			fetch('/getUnitDescByActivity?actId=' + encodeURIComponent(actId))
			       .then(response => {
			           if (!response.ok) {
			               throw new Error("Unit description not found");
			           }
			           return response.text();
			       })
			       .then(unitDesc => {
			           unitSpan.textContent = unitDesc;
			       })
			       .catch(error => {
			           console.error("Error fetching unit description:", error);
			           unitSpan.textContent = "";
			       });

		});
		
		const targetInput = document.getElementById("target");

		    targetInput.addEventListener("input", function () {

		        const unitDesc = document.getElementById("unitDesc")
		            .textContent.trim().toLowerCase();

		        let value = this.value;

		        if (unitDesc === "nos") {
		            // Whole numbers only
		            value = value.replace(/[^0-9]/g, "");
		        } else {
		            // Decimal numbers up to 5 decimal places
		            value = value.replace(/[^0-9.]/g, "");

		            const parts = value.split(".");

		            if (parts.length > 2) {
		                value = parts[0] + "." + parts.slice(1).join("");
		            }

		            const decimalParts = value.split(".");

		            if (decimalParts.length === 2) {
		                value = decimalParts[0] + "." +
		                    decimalParts[1].substring(0, 2);
		            }
		        }

		        this.value = value;
		    });
		
		
	});
	
	

</script>

</head>

<body>





<div layout:fragment="content">


    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
               Add Details of DPR NRM Target
            </h4>
        </div>
		
		<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${success}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
		    <span th:text="${error}"></span>
		    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		
        <div class="card-body">

             <form id="DPRNRMTarget" th:action="@{/saveDPRNRMTarget}" method="post" novalidate>
				
				<div class="row g-4">
					
				        <div class="col-md-6">
				             <label class="form-label">
				                 <b> District </b><span class="required">*</span>
				              </label>
								<select id="district" name="district" class="form-select" required>
									<option value="">--Select District--</option>
										<th:block th:each="dist : ${distList}">
											<option th:value="${dist.dcode}" th:text="${dist.distName}"></option>
										</th:block>
								</select>
								<div class="invalid-feedback">Please select a District.</div>
				       	</div>
						
						<div class="col-md-6">
							<label class="form-label">
								<b> Project </b><span class="required">*</span>
							</label>
							<select id="project" name="project" class="form-select" required>
								<option value="">--Select Project--</option>
							</select>
							<div class="invalid-feedback">Please select a Project.</div>
						</div>
						
				        <div class="col-md-6">
							<label class="form-label">
								<b> Name of Head </b><span class="required">*</span>
							</label>
							<select id="head" name="head" class="form-select" required>
							    <option value="">--Select Head--</option>
								<th:block th:each="hd : ${headList}">
									<option th:value="${hd.headCode}" th:text="${hd.headDesc}"></option>
								</th:block>
							</select>
							<div class="invalid-feedback">Please select a Head.</div>
				        </div>
						<div class="col-md-6">
							<label class="form-label">
								<b> Name of Activity</b> <span class="required">*</span>
							</label>
							<select id="activity" name="activity" class="form-select" required>
							    <option value="">--Select Activity--</option>
							</select>
							<div class="invalid-feedback">Please select Activity</div>
						</div>
						
						<div class="col-md-6">
							<label class="form-label">
									<b>Target (<span id="unitDesc" class="fw-bold text-primary"></span>)</b> <span class="required">*</span>
							</label>
							
						</div>
				       	
						<div class="col-md-6">
							<input type="text" name="target" id="target" class="form-control" style="height:40px; width: 300px;"
								 inputmode="decimal" maxlength="10" required>
							<div class="invalid-feedback">Please Enter Target</div>
							<div id="targetError" class="text-danger"></div>
						</div>
				       			 
						 	
				</div>
				
						<div class="text-center mt-4">
							<button type="submit" name="action"  value="D" class="btn btn-warning" >
							      <i class="fas fa-save"></i>
							      Save as Draft
							</button>
							
						</div>
				
            </form>
			

        </div>
		
		
		
		
		

    </div>
	
</div>

</body>
</html>
