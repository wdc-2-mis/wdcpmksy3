<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title>PPR Request For DOLR Approval</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<style>
			.required{
			    color:red;
			}
		</style>
</head>
<body>
	<br layout:fragment="content">	
		<div class="card-header bg-primary text-white">
			<h4 class="mb-0">
				PPR Request For DOLR Approval
			</h4>
		</div>
		<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${success}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		</br>
		<div th:if="${pprRequestDolrApprovalList != null}">
					<h4> <b><center>List of PPR Details For Approval</center></b> </h4>
					
				    <table class="table table-bordered table-striped table-hover">
				        
				        <thead class="table-primary">
				        <tr>
							<th>Name of the Project</th>
				            <th>District Name</th>
				            <th>Financial Year</th>
							<th>Proposed Area</th>
							<th>Proposed Cost</th>
				            <th>Action</th>
				        </tr>
				        </thead>
				        <tbody>
				        <tr th:each="data : ${pprRequestDolrApprovalList}">
							<td th:text="${data.projectName}"></td>
				            <td th:text="${data.districtName}"></td>
							<td th:text="${data.finYear}"></td>
							<td th:text="${data.treatedArea}"></td>
				            <td th:text="${data.proposedCost}"></td>
							<td>
								<div class="d-flex align-items-center gap-2">
									<button type="button" class="btn btn-primary btn-sm editBtn" th:data-id="${data.pprProjectGlanceId}" data-bs-toggle="modal"
										data-bs-target="#editModal" th:if="${#strings.trim(data.status) == 'D'}">
										<i class="fas fa-edit"></i>
									</button>
									&nbsp;
									<a th:if="${#strings.trim(data.status) == 'D'}" th:href="@{/deletePprProProjectGlance(id=${data.pprProjectGlanceId})}"
										class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this record?');">
										<i class="fas fa-trash"></i>
									</a>
									<a th:if="${#strings.trim(data.status) == 'D'}" th:href="@{/completePprProProjectGlance(id=${data.pprProjectGlanceId})}"
										class="btn btn-success btn-sm" onclick="return confirm('Are you sure you want to Complete this record?');">
										<i class="fas fa-check"></i>
									</a>
									<span th:if="${#strings.trim(data.status) == 'C'}" class="badge bg-success">
										<i class="fas fa-check-circle"></i> Completed
									</span>
								</div>
				            </td>
				        </tr>
				        <tr th:if="${#lists.isEmpty(pprRequestDolrApprovalList)}">
				            <td colspan="15" class="text-center text-danger">
				                No records found.
				            </td>
				        </tr>
				        </tbody>
				    </table>
				</div>
	</div>
</body>
</html>
