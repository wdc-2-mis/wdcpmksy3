<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>List of Rejected PPR</title>

<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->
<style>
	.required{
	    color:red;
	}

	body{
	    background:#f8f9fa;
	}

	.card{
	    border-radius:0;
	}

	.table th,.table td{
	    vertical-align:middle;
	    text-align:center;
	}

	.form-control,
	.form-select{
	    border-radius:0;
	}

	.heading{
	    font-size:22px;
	    font-weight:bold;
	    text-align:center;
	    margin-bottom:25px;
	}

	label{
	    font-weight:600;
	}	
</style>




</head>

<body>





<div layout:fragment="content">


    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
               List of Rejected PPR
            </h4>
        </div>
		
		<div class="table-responsive mt-4"
		     th:if="${#lists.size(records) > 0}">
			
			<table class="table table-bordered table-striped" style="min-width:1200px;">

			           <thead class="table-primary">
			               <tr>
			                   <th>S.No.</th>
			                   <th>District Name</th>
							   <th>project Name</th>
			                   <th>Financial Year</th>
							   <th>Remarks</th>
							   <th>Action</th>
			               </tr>
			           </thead>
			           <tbody>

			               <tr th:each="rec, iterStat  : ${records}">
								<td th:text="${iterStat.count}"></td>
								<td>
								    <span th:if="${iterStat.index == 0 or rec.ppr.district.dcode != records[iterStat.index - 1].ppr.district.dcode}"
								             th:text="${rec.ppr.district.distName}">
								    </span>
								</td>
								<!--<td th:text="${rec.ppr.district.distName}"></td>-->
								<td th:text="${rec.ppr.projectName}"></td>
								<td th:text="${rec.ppr.finYear.finYrDesc}"></td>
								<td th:text="${rec.remarks}"></td>
							    <td>
									<a th:href="@{/modifyPprTransaction(tranxId=${rec.ppr.pprId})}"
									   class="btn btn-primary btn-sm" onclick="return confirm('Do you want to Modify Rejected PPR.');">
									    Modify
									</a>
							   	</td>
			               </tr>
			               <tr th:if="${#lists.isEmpty(records)}">
			                   <td colspan="5" class="text-center text-muted">
			                       Data Not Found
			                   </td>
			               </tr>

			           </tbody>

			       </table>

		</div>
		
		
		

    </div>
	
			

</div>

</body>
</html>
