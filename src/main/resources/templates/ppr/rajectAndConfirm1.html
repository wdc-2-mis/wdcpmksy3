<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>List of Rejected PPR</title>

<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">-->
<style>
	.required{
	    color:red;
	}

	body{
	    background:#f8f9fa;
	}

	.card{
	    border-radius:0;
	}

	.table th,.table td{
	    vertical-align:middle;
	    text-align:center;
	}

	.form-control,
	.form-select{
	    border-radius:0;
	}

	.heading{
	    font-size:22px;
	    font-weight:bold;
	    text-align:center;
	    margin-bottom:25px;
	}

	label{
	    font-weight:600;
	}	
</style>



</head>

<body>





<div layout:fragment="content">


    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
               List of PPR Menu to Modify Data
            </h4>
        </div>
		
		<div class="table-responsive mt-4">
			
			<table class="table table-bordered table-striped" style="min-width:1200px;">

			           <thead class="table-primary">
			               <tr>
			                   <th>S.No.</th>
			                   <th>Menu Name</th>
							   <th>Action</th>
			               </tr>
			           </thead>
			           <tbody>

			               <tr th:each="rec, iterStat  : ${submenuList}">
								<td th:text="${iterStat.count}"></td>
								<td class="text-start" th:text="${rec.submenuName}"></td>
							    <td>
									<!--<a th:href="@{rec.target}"
									   class="btn btn-primary btn-sm" onclick="return confirm('you want to Modify');">
									    Modify
									</a>-->
									<a th:href="@{${rec.target}(pprid=${pprid})}" class="btn btn-primary btn-sm"
										onclick="return confirm('Do you want to Modify/Update Data for Rejected PPR.');">
										Modify/Update Data
									</a>
									
							   	</td>
			               </tr>
			               <tr th:if="${#lists.isEmpty(submenuList)}">
			                   <td colspan="3" class="text-center text-muted">
			                       Data Not Found
			                   </td>
			               </tr>

			           </tbody>

			       </table>

		</div>
		
		
		

    </div>
	

</div>

</body>
</html>
