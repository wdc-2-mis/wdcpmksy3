<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

	  <head> <meta charset="UTF-8">

	  <title>Add / Modify Menu</title>

	  <style>
	      .table-wrapper {
	          margin: 20px;
	      }

	      .table-title {
	          margin-bottom: 20px;
	      }

	      .alert {
	          padding: 5px 10px;
	          margin-left: 5px;
	      }

	      .alert-danger {
	          color: #842029;
	          background-color: #f8d7da;
	          border: 1px solid #f5c2c7;
	      }

	      .alert-info {
	          color: #055160;
	          background-color: #cff4fc;
	          border: 1px solid #b6effb;
	      }

	      .square_btn {
	          padding: 8px 25px;
	          border: none;
	          cursor: pointer;
	      }

	      .role-item {
	          display: block;
	          margin-bottom: 5px;
	      }
	  </style>

	  <script>

	      function getValue(obj) {

	          const parentSelect =document.getElementById("parentMenu");

	          const roleDiv =document.getElementById("role");

	          const roleLabel =document.getElementById("role1");

	          if (obj.value == "1") {

	              // Parent
	              parentSelect.value = "0";
	              parentSelect.disabled = true;

	              roleDiv.style.display = "none";
	              roleLabel.style.display = "none";

	          } else {

	              // Child
	              parentSelect.disabled = false;

	              roleDiv.style.display = "block";
	              roleLabel.style.display = "block";
	          }
	      }

		  // Form Validation 
		  function validateMenuForm() 
		  { 
			const menuType = document.querySelector( 'input[name="isParent"]:checked' ); 
			const menuName = document.getElementById("submenuName"); 
			const parentMenu = document.getElementById("parentMenu"); 
			const target = document.getElementById("target"); 
			const seqNo = document.getElementById("seqNo"); 
			
			// Check Menu Type 
			if (!menuType) 
			{ 
				alert("Please select Type of Menu."); 
				return false; 
			} 
			// Common validation 
			// Menu Name mandatory for both Parent and Child 
			if (menuName.value.trim() === "") 
			{ 
				alert("Menu Name is mandatory."); 
				menuName.focus(); 
				return false; 
			} 
			// Sequence mandatory for both Parent and Child 
			if (seqNo.value.trim() === "") 
			{ 
				alert("Sequence No is mandatory."); 
				seqNo.focus(); 
				return false; 
			} 
			// Parent Menu 
			if (menuType.value === "1") 
			{ 
				// Parent menu does not require target 
				// Parent menu does not require parent selection 
				return true; 
			} 
			// Child Menu 
			if (menuType.value === "0") 
			{ 
				// Parent Menu mandatory 
				if ( parentMenu.value === "" || parentMenu.value === "0" ) 
				{ 
					alert("Please select Parent Menu."); 
					parentMenu.focus(); 
					return false; 
				} 
				// Target mandatory 
				if (target.value.trim() === "") 
				{ 
					alert("Target is mandatory for Child Menu."); 
					target.focus(); 
					return false; 
				} 
				// Target must start with / 
				if (!target.value.trim().startsWith("/")) 
				{ 
					alert("Target must start with '/'.\nExample: /dashboard"); 
					target.focus(); 
					return false; 
				}
				const roles = document.querySelectorAll('input[name="mapRoleId"]:checked');
				if (roles.length === 0) {
					alert("Please select at least one Role for Child Menu.");
					return false;
				} 
			} 
			return true; 
		} 
		// Initialize menu type when page loads
	      document.addEventListener("DOMContentLoaded", function () {

	          const selected = document.querySelector('input[name="isParent"]:checked');

	          if (selected) {
	              getValue(selected);
	          }
	      });
		  
		  function validateSeqNo(input) {
		      // Remove anything except digits and dot
		      input.value = input.value.replace(/[^0-9.]/g, '');

		      // Keep only the first decimal point
		      const firstDot = input.value.indexOf('.');
		      
		      if (firstDot !== -1) {
		          input.value =
		              input.value.substring(0, firstDot + 1) +
		              input.value.substring(firstDot + 1).replace(/\./g, '');

		          // Allow only 1 digit after decimal
		          const parts = input.value.split('.');
		          if (parts[1].length > 1) {
		              input.value = parts[0] + '.' + parts[1].substring(0, 1);
		          }
		      }
		  }

	  </script>

	  </head>

<body>





<div layout:fragment="content">


	<div class="card shadow-sm border-0">

	        <div class="card-header bg-primary text-white">
	            <h4 class="mb-0">
	               Add Menu
	            </h4>
	        </div>
			
			<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
				<span th:text="${success}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>
			<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
			    <span th:text="${error}"></span>
			    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

	        <div class="card-body">

	            <form th:action="@{/saveMenu}" th:object="${menu}" method="post" onsubmit="return validateMenuForm();"> 
					<table class="table table-striped table-highlight"> <!-- Menu ID --> 
						<input type="hidden" th:field="*{submenuId}" /> <!-- Menu Name --> 
						<tr> 
							<td>Menu Name : </td> 
							<td> <input type="text" th:field="*{submenuName}" class="form-control" /> 
								<div th:if="${#fields.hasErrors('submenuName')}" class="alert alert-danger" th:errors="*{submenuName}"> </div> 
							</td> 
						</tr> 
						<!-- Hindi Menu Name --> 
						<tr> 
							<td>Menu Hindi Name : </td> 
							<td><input type="text" th:field="*{submenuHindiName}" class="form-control" /> </br><span class="alert alert-info"> (Not applicable for After Login Menu) </span> 
								<div th:if="${#fields.hasErrors('submenuHindiName')}" class="alert alert-danger" th:errors="*{submenuHindiName}"> </div> 
							</td> 
						</tr> 
						<!-- Status --> 
						<tr> 
							<td>Status :</td> 
							<td> 
								<input type="checkbox" th:field="*{isActive}" /> <span class="alert alert-info"> (Check to make the menu active) </span> 
							</td> 
						</tr> 
						<!-- Menu Type --> 
						<tr> 
							<td>Type of Menu :</td> 
							<td> 
								<label> <input type="radio" th:field="*{isParent}" value="1" onchange="getValue(this)" /> Parent </label> 
								<label style="margin-left:20px;"> <input type="radio" th:field="*{isParent}" value="0" onchange="getValue(this)" /> Child </label> 
							</td> 
						</tr> 
						<!-- Parent Menu --> 
						<tr> 
							<td> Parent Menu Name : </td> 
							<td> 
								<select id="parentMenu" th:field="*{menu.menuId}" class="form-select" style="height:40px; width: 600px;"> 
									<option value="0"> ---Select Parent Menu--- </option> 
									<option th:each="parent : ${listMenu}" th:value="${parent.menuId}" th:text="${parent.menuName}"> </option> 
								</select> 
								<div th:if="${#fields.hasErrors('menu.menuId')}" class="alert alert-danger" th:errors="*{menu.menuId}"> </div> 
								<div th:if="${selectchild}" class="alert alert-danger" th:text="'Error: ' + ${selectchild}"> </div> 
							</td> 
						</tr> 
						<!-- Target --> 
						<tr> 
							<td>Target :</td> 
							<td> <input type="text" th:field="*{target}" class="form-control" style="height:40px; width: 600px;" /> </br>
								<span class="alert alert-info"> ( The link is mandatory for the Child Menu and must start with / ) </span> 
								<div th:if="${#fields.hasErrors('target')}" class="alert alert-danger" th:errors="*{target}"> </div> 
								<!--<div th:if="${error}" class="alert alert-danger" th:text="'Error: ' + ${error}"> </div> -->
							</td> 
						</tr> 
						<!-- Sequence --> 
						<tr> 
							<td>Sequence : </td> 
							<td> 
								<input type="number" step="0.5" th:field="*{seqNo}" class="form-control" style="height:40px; width: 300px;"   /> 
								<div th:if="${#fields.hasErrors('seqNo')}" class="alert alert-danger" th:errors="*{seqNo}"> </div> 
								<!--<div th:if="${error}" class="alert alert-danger" th:text="${error}"> </div>-->
							</td> 
						</tr> 
						<!-- Role --> 
						<tr> 
							<td> 
								<div id="role1"> Role : </div> 
							</td> 
							<td> 
								<div id="role"> 
									<div th:each="role : ${listRole}" class="role-item"> 
									<label> 
										<input type="checkbox" th:field="*{mapRoleId}" th:value="${role.roleId}" /> 
										<span th:text="${role.roleName}"> </span> 
									</label> 
									</div> 
									<div th:if="${#fields.hasErrors('mapRoleId')}" class="alert alert-danger" th:errors="*{mapRoleId}"> </div> 
								</div> 
							</td> 
						</tr> 
						<!-- Save --> 
						<tr> 
							<td class="col-md-4" style="text-align:center;" > 
								<button type="submit"  class="btn btn-primary"> Save </button> 
							</td> 
						</tr> 
					</table> 
				</form>

	        </div>
			
			
			
			
			

	    </div>
	

</div>

</body>
</html>
